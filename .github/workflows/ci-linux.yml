name: Linux Qt CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/qt-unix.yml
    with:
      runner: ubuntu-24.04
      qt-host: linux
      qt-arch: linux_gcc_64

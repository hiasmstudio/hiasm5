[Property]
FindStop=True - останавливать поиск при первой коллизии (onTrue ARG(Index)), False - Проверяет весь массив и выдает все коллизии (onTrue ARG(Index,Index,...))|14|0|True,False

[Methods]
doCollision=Проверяет коллизию двух регионов Region1 и Region2|1|0
doEnum=Проверяет коллизию Region1 с регионами из массива (исключает проверку региона из массива равному Region2)|1|0
onTrue=Событие происходит если регионы столкнулись ARG(Index) если FindStop=True иначе MT-поток: ARG(Index,Index,...)|2|0
onFalse=Событие происходит если регионы не столкнулись ARG(Region1)|2|0
*onCollision=Событие происходит всякий раз после проверки на коллизию двух регионов ARG(Result)|2|0
Result=Содержит регион результат коллизии|3|1
Collision=Содержит индекс результата коллизии (1 - была коллизия, 0 - не было)|3|1
Count=Колличество регионов с которыми произошла коллизия региона Region1|3|1
Region1=Определяет первый регион|4|1
Region2=Определяет второй регион|4|1
Array=Массив регионов|4|13

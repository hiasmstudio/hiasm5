@HOR_POSITIVE=Expand/collapse left to right (ignored when used with CENTER)|14|1|True,False
@HOR_NEGATIVE=Expand/collapse from right to left (ignored when used with CENTER)|14|1|True,False
@VER_POSITIVE=Expand/collapse from top to bottom (ignored when used with CENTER)|14|1|True,False

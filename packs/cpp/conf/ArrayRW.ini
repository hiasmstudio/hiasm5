[Type]
Class=Element
Info=Writing and reading from an array

[Property]
+Index=Default array element index|3|


[Methods]
doRead=Reads the array element with index Index|1|
doWrite=Writes the value from the Value field to the array element with index Index|1|
doAdd=Adds an element to the end of the array|1|
onRead=The event occurs every time an array element is read and outputs its value to the stream|2|
Item=Contains an array element after the doRead method is executed|3|
*Count=Contains the number of array elements|3|1
Array=Defines the array identifier|4|13
Index=Determines the index of an array element|4|1
Value=Defines the value to be written to the array|4|
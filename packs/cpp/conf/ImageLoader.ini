[Type]
Class=Element
Info=Loading and rendering images of various formats
Tab=Graphics

[Property]
FileName=Defines the default image file name|2|
@ScaleMode=Drawing method: Draw - draws the image with original dimensions from the starting point Point1; Stretch - fits the image into the drawing area <Point1,Point2>; ScaleMin and ScaleMax - fits into the display area <Point1,Point2> respecting the proportions; Mosaic - "pave" the display area <Point1,Point2> with a fragment <Point3,Point4> from the original image |14|2|Draw,Stretch,ScaleMin,ScaleMax,Mosaic
DrawSource=Graphics output object: Bitmap - picture, Handle - window or Windows control, NewBitmap - a new picture is created and issued by the onDraw event|4|0|Bitmap,Handle,NewBitmap
##Points=Drawing areas in DrawSource, and in the original image
Point1=Coordinates of the upper left corner of the display area|1|0
Point2=Coordinates of the lower right corner of the display area. When =0, saves the lower right corner from DrawSource|1|0
Point2AsOffset=Count the coordinates of the second point relative to the first|14|1|True,False
Point3=Coordinates of the upper left corner in the source file|1|0
Point4=Coordinates of the lower right corner in the source file. When =0, retains the lower right corner from the original image|1|0
Point4AsOffset=Count the coordinates of the 4th point relative to the 3rd|14|1|True,False
##

[Methods]
doLoad=Loads an image from a file|1|0
doDraw%DrawSource%=Draws an image on a picture or window|1|0
onLoad=The event occurs every time the image is fully loaded|2|0
onDraw=The event occurs when the image is drawn (if DrawSource=NewBitmap contains the image in the stream) ARG([Bitmap])|2|0
Busy=Contains 1 if the file is being downloaded, 0 otherwise|3|1
ImageWidth=Width of the loaded original image|3|1
ImageHeight=Height of the loaded original image|3|1
FileName=Specifies the name of the image file|4|2

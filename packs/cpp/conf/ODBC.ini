[Methods]
doConnectDSN=Creates a connection to the Database using the specified DSN|1|
*doConnectDrv=Creates a connection to the Database using the specified driver|1|
doQuery=The stream transmits a SQL query string for selecting fields|1|
doExec=The stream transmits an SQL query string to change fields|1|
*doBinary=The stream contains a string of SQL query for changing binary fields. Recording data is taken from the top of the BinaryStream|1|
doDisconnect=Closes the connection to the Database|1|
*doList=Creates a list of ODBC drivers or data sources installed on the system. The list is obtained from the onStreamString event stream, and the attributes are obtained from the onStreamBinary event stream. The type of requested data is specified by the BrowseType property or the top dot of the same name.|1|
*doSetup=Creates a new data source (DSN) associated with a Database file through the selected driver specified by the Driver property or the top point of the same name and the name specified by the DSN_Name property|1|
onStreamString=Outputs a string query result to the stream|2|
onStreamBinary=Outputs a binary query result to the stream for the doQuery method, but outputs a string query result to the stream for the doList method, returning attributes of drivers or data sources|2|
onRowCount=Occurs when a request to change fields is successful. Returns the number of fields changed|2|
*onColumnsInfo=Occurs before the requested data is returned. The stream contains field names|2|
*onError=Occurs when an error occurs in the operation of the component (with the Error = ErrorNumber property set) and outputs the error number to the stream. For a description of error numbers, see the component help.|2|

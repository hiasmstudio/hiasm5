[About]
Version=2.50 for b164 and higher for Delphi and FPC
Author=nesco & HiAsm ©

[Type]
Class=Element
Info=Chart on the icon
Tab=Controls

[Property]
@Max=Maximum chart value|1|100
@Sensit=Minimum value at which the chart starts working|1|2
@TranspIcon=True - transparent icon, False - icon with FonColor background color|14|0|True,False
@Style=Display style|14|0|Histogram,Graph,Numeric,Bar
@KindBar=Indicator orientation for Bar style|14|0|Vertical,Horisontal
@FrameBar=True - display the border for the Bar style, False - do not display the border|14|0|True,False
@ChannelsBar=Number of channels for Bar style|14|1|One,Two
##Colors=Element colors
@FonColor=Fill color of transparent areas of the icon when TranspIcon=True|8|clBlack
@TranspColor=Fill color of transparent areas of the icon for onBmpGraph|8|clBtnFace
@GraphColor=Chart line color for Histogram and Chart styles|8|clLime
@TextColor=Text color for Numeric style|8|clCream
@FrameColor=Bar style border color|8|clGray
@MinColor=Minimum range color for Bar style|8|clLime
@MidColor=Middle Range Color for Bar Style|8|clYellow
@MaxColor=Maximum range color for Bar style|8|clRed
##

[Methods]
doPosition1=Draws the first (for all styles) channel by value from the stream|1|
doPosition2=Draws the second channel by value from the stream|1|
onIconGraph=The event occurs every time the chart is drawn and outputs the resulting icon ARG(Icon) to the stream.|2|
*onBmpGraph=The event occurs every time the chart is drawn and outputs the resulting image ARG(Bitmap) to the stream.|2|
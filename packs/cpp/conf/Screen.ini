[Type]
Class=Element
Info=Screen

[Property]
X=Defines the default screen width in pixels|1|800
Y=Defines the default screen height in pixels|1|600
Frequency=Defines the default screen refresh rate|1|75
BitsPerPixel=Defines the color depth of a pixel|1|32
SetChange=Applying changes. Default - dynamic screen change. UpdateRegistry - dynamically changing the screen with an entry to the registry|4|0|Default, UpdateRegistry
EnumMask=Defines a mask for displaying a list of available monitor modes: %h,%v - screen height and width, %bpp - color depth, %f - refresh rate|2|%vx%hx%bpp - %f

[Methods]
doResolution=Sets the screen resolution|1|
doFrequency=Sets the screen refresh rate|1|
*doBitsPerPixel=Sets the screen pixel color depth|1|
*doSetScreen=Sets screen parameters: resolution, refresh rate, color depth|1|
doEnum=Lists all possible monitor modes|1|
onEnum=Returns information about the monitor mode from the EnumMask|2|
Width=Contains the screen width in pixels|3|1
Height=Contains the screen height in pixels|3|1
*TopWorkarea=Contains the top padding of the screen working area|3|1
*LeftWorkarea=Contains the left padding of the screen working area|3|1
*BottomWorkarea=Contains the bottom padding of the screen working area|3|1
*RightWorkarea=Contains the right padding of the screen working area|3|1
*CurBitsPerPixel=Contains the current screen pixel color depth|3|1
CurFrequency=Contains the current screen refresh rate|3|1
*CurDPIX=Contains the number of pixels per inch across the width of the screen|3|1
*CurDPIY=Contains the number of pixels per inch of screen height|3|1
X=Defines the width of the screen in pixels|4|1

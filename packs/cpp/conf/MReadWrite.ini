[About]
Version=1.00
Author=nesco

[Type]
Class=Element
Info=Writing and reading data

[Property]
DataSource=Data source|20|(empty)|DS_Table
@Column=Name of the data source column for issuing elements to the stream|2|
+Index=Default data source element index|1|0

[Methods]
doRead=Reads the data source element with Index|1|
doWrite=Writes the value from the Value field to the data source element with index Index|1|
onRead=The event occurs each time a data source element is read and outputs its value to the stream|2|
Item=Contains the data source element after the doRead method is executed|3|
*Count=Contains the number of data source rows|3|1
Index=Defines the index of a data source element|4|1
Value=Specifies a value to write to a data source element|4|
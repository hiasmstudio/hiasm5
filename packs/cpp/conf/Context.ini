[About]
Version=1.0
Author=Dilma

[Type]
Class=Element
Info=Explorer context menu extension

[Property]
Info=Application information|2|
Name=Application name|2|
Menu=Menu items, where one line is the name of the item displayed in the Explorer menu|5|
FileType=The file type for which the application is created (for example, txtfile for a text file or * for all files)|2|*

[Methods]
onFileName=The event occurs every time the Explorer context menu is expanded and displays the names of the selected files in a stream (one by one)|2|
onCommand=The event occurs whenever a menu item is selected and displays the number of the selected item in the stream (from 0 to Count-1, where Count is the number of items)|2|
onCurrentDir=The event occurs whenever the Explorer context menu is expanded (but before the onFileName event occurs) and streams the name of the current folder|2|
[Type]
Class=Element
Info=Looping through multidimensional stream data

[Property]
Type=Direction of enumeration of elements Inc - from first to last, Dec - from last to first|4|0|Inc,Dec
onBreakEnable=True - after doStop the onBreak event is called, but onEndEnum is not called|14|1|True,False

[Methods]
doEnum=Starts iterating over the elements of a multidimensional stream|1|
doStop=Stops iterating over elements|1|
onItem=Outputs the next element of a multidimensional stream into the stream|2|
onEndEnum=The event occurs every time after the completion of enumerating the elements of a multidimensional stream, and is required if onBreakEnable=False|2|
*onBreak=The event occurs when onBreakEnable=True, after the onItem event, if the doStop method was called at the same time|2|
Item=Contains the last multidimensional stream item read after the onItem event was called|3|
Index=Contains the index of the current MT element after calling the onItem event|3|1
MT=The stream whose elements need to be iterated|4|
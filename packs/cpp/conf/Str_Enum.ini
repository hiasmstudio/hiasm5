[About]
Version=2.51
Author=nesco & Tad

[Type]
Class=Element
Info=Looping through string elements
Tab=Strings

[Property]
+@Delimiter=Separator character. If not specified, then the string is iterated in groups of characters with Step steps|2|;
@From=Return elements starting from the Nth NumSubStr|1|1
@To=Return elements up to the Nth NumSubStr, or until the end when N=-1|1|-1
@Step=String iteration step when iterating over groups of characters|1|1
@OnlyDivGroup=True - show only multiple groups, False - show all groups|14|0|True,False
Direct=Direction of iterating over row elements|4|0|Forward,Reverse
onBreakEnable=True - after doStop the onBreak event is called, but onEndEnum is not called|14|1|True,False

[Methods]
doEnum%Direct%=Starts iterating over the elements of a string|1|0
doStop=Stops iterating over the elements of a row|1|
onEnum=Outputs the next line element to the stream|2|0
onEndEnum=The event occurs after iterating through all the elements of the string|2|0
*onBreak=The event occurs when onBreakEnable=True after the onEnum event, if the doStop method was called, outputting the last element of the line found to the stream|2|
String=Defines the string to iterate over|4|2
NumSubStr=Contains the number of the current line element (from the beginning or from the end, depending on the Direct property) after the onEnum event is called and starts from 1|3|1
Part=Contains the current row element|3|2
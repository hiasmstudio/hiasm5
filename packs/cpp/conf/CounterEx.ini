[About]
Version=1.51
Author=nesco

[Type]
Class=Element
Info=Advanced counter

[Property]
@Min=Setting the minimum counter value|1|0
@Max=Setting the maximum counter value|1|100
@Step=Setting the counter step|1|1
@Direct=Inc count direction: from Min to Max, Dec: from Max to Min |4|0|Inc,Dec
Default=Counter initial value|1|0

[Methods]
doNext=Sets the next counter value|1|
*doPrev=Sets the previous counter value|1|
*doReset=Resetting the counter to its initial value|1|
*doValue=Sets the counter value|1|
onNext=The event occurs whenever a new counter value is set and returns its current value to the stream|2|
*onSet=The event occurs whenever doReset or doValue is used, returning the set value to the stream|2|
*onThroughMax=The event occurs every time after passing through the maximum counter value|2|
*onThroughMin=The event occurs every time after passing through the minimum counter value|2|
Count=Contains the current counter value|3|1
*Max=Contains the maximum counter value|3|1
*Min=Contains the minimum counter value|3|1
*Direct=Contains the current counting direction (0 - Inc, 1 - Dec)|3|1
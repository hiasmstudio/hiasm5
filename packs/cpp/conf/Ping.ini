[Type]
Class=Element
Info=Checking the computer's availability on the network

[Property]
Name=Determines the default network name of the searched computer|2|localhost
ByteCount=Number of bytes to send to the remote host|1|128
TimeOut=Waiting time for a response from the server|1|1000

[Methods]
doPing=Starts the verification procedure (ping) ARG(Name)|1|
onFind=The event occurs if the computer has been found and outputs its network IP address ARG(IP) to the stream.|2|
onFailed=The event occurs if the host search is unsuccessful and issues an error code ARG(ErrorCode) to the stream.|2|
*Time=Ping time (i.e. the time between sending and receiving data)|3|1
*ByteCount=Number of bytes received (must be equal to the number of bytes sent)|3|1
Name=Specifies the computer network name or Internet address that needs to be checked (for example, localhost)|4|2

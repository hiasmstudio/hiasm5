[Type]
Class=Element
Info=Folder Operations

[Methods]
doCreate=Creates a new folder with a name determined by Source|1|
doRename=Renames the Source folder to Dest|1|
doDelete=Deletes an empty folder named Source|1|
*doExists=Checks the presence of a folder named Source on the device and issues in the onOK stream: 1 - if the folder exists, 2 - if the file exists and 0 - if there are none|1|
*doGetSize=Counts the volume of the entire contents of a folder|1|
onOK=The event occurs if the operation is successful|2|
Source=Name of the folder on which the operation is performed|4|2
Dest=New folder name for Rename operation|4|2

[Property]
+@Char=Separator character|2|;
@From=Remember starting from the Nth|1|0
Count=Number of memorized parts|1|2
Direct=Separation direction|4|0|Forward,Reverse

[Methods]
doSplit%Direct%=Divides a string into parts (for example, the string "Left=120=2" with a Char property of "=" will be split into "Left", "120" and "2")|1|0
doClear=Clears memory|1|0
onSplit=The event occurs after the string is split and outputs the remaining part of it to the stream.|2|0
*onNotFound=The event occurs when there is no delimiter in the line|2|0
Str=Specifies a string to split into parts|4|2
[About]
Version=2.0
Author=Galkov

[Type]
Class=Element
Info=Parallel port LPT

[Property]
@Port=Defines the port address|4|0|0x378,0x278,0x3BC
Format=Defines the format of the string returned by the PortInfo method: %0 - number of available LPT ports; %1 - LPT1 address; %2 - LPT2 address; %3 - LPT3 address;|2|All=%0: @LPT1=%1; @LPT2=%2; @LPT3=%3;

[Methods]
doData=Sets the data byte on Port+0|1|
*doD0=Sets bit D0 to Port+0 with a bool value from the stream|1|
*doD1=Sets bit D1 to Port+0 with the bool value from the stream|1|
*doD2=Sets bit D2 to Port+0 with a bool value from the stream|1|
*doD3=Sets bit D3 to Port+0 with a bool value from the stream|1|
*doD4=Sets bit D4 to Port+0 with a bool value from the stream|1|
*doD5=Sets bit D5 to Port+0 with a bool value from the stream|1|
*doD6=Sets bit D6 to Port+0 with a bool value from the stream|1|
*doD7=Sets bit D7 to Port+0 with a bool value from the stream|1|
doCheck=Receives and checks input lines via Port+1|1|
*doDataIn=Accepts input lines via Port+0|1|
*doControl=Sets the control byte on Port+2 (bit D4 is masked)|1|
onStatus=Outputs a status byte to the stream via Port+1 (response to doCheck)|2|
*onDataIn=Outputs a byte read via Port+0 into the stream (in bidirectional mode - physical data)|2|
*onERR=Occurs every time bit D3 in Port+1 changes - and its value (0/1) in the stream (response to doCheck)|2|
*onSLCT=Occurs every time bit D4 in Port+1 changes - and its value (0/1) in the stream (response to doCheck)|2|
*onPE=Occurs every time bit D5 in Port+1 changes - and its value (0/1) in the stream (response to doCheck)|2|
*onACK=Occurs every time bit D6 in Port+1 changes - and its value (0/1) in the stream (response to doCheck)|2|
*onBUSY=Occurs every time bit D7 in Port+1 changes - and its value (0/1) in the stream (response to doCheck)|2|
PortInfo=Displays information about the LPT ports of the computer (see Format property)|3|2
*Port0=Alternative reading of data from Port+0|3|1
*Port1=Alternative reading of data from Port+1|3|1
*Port2=Reading data from Port+2|3|1
Byte=Determines the byte to be written to the port using the doData and doControl methods|4|1
*LPT=Determines the LPT port number using the doPort method and during initialization|4|1
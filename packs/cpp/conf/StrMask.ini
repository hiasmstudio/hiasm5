CaseSensitive=Case sensitivity of letters in a string|4|1|True,False

[Methods]
doCompare=Compares a string with a mask|1|
onFalse=The event occurs if the string does not match the mask|2|
onTrue=The event occurs if the string matches the mask|2|
Str=Defines a string to compare with a mask|4|2
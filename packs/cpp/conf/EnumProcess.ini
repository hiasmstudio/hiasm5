[About]
Version=3.80
Author=nesco

[Type]
Class=Element
Info=Advanced process management in NT line OS
Tab=System

[Property]
@DebugPrivilege=Allow access to all processes with debugger rights|14|0|True,False
Name=Default name of the searched process|2|
TimeOut=Waiting time for process completion in ms|1|5000
TimeScan=Interval for polling CPU load by the current process in ms|1|1000

[Methods]
doEnum=Starts listing running processes|1|
*doFindName=Searches for a process by its name. If found, makes it currently selected|1|
doFindID=Searches for a process by its unique ID. If found, makes it currently selected|1|
doKill=Kills the selected process|1|
*doGetPriority=Gets the priority of the selected process|1|
*doSetPriority=Sets the priority of the selected process (0 - medium, 1 - low, 2 - high, 3 - real time, 4 - below average, 5 - above average)|1|
*doGetProc=Gets the mask of valid processors for the selected process|1|
*doSetProc=Sets the mask of valid processors for the selected process (from 1 to n processors in the AffinityMask bitmask)|1|
*doGetProcBoost=Gets the boost value of the selected process|1|
*doSetProcBoost=Sets the boost value of the selected process (0 - disable boost, 1 - enable boost)|1|
*doGetMemoryInfo=Gets the memory size of the selected process in bytes|1|
*doGetProcessAccount=Gets the username of the selected process|1|
*doGetCmdLine=Gets the command line of the selected process|1|
*doStartCPUUsage=Starts monitoring the CPU load of the current process|1|
*doStopCPUUsage=Stops CPU usage monitoring by the current process|1|
*doTerminateApp=Terminates the selected process. If the process does not complete during TimeOut, it will be destroyed|1|
onProcess=The event occurs whenever the next process is found and returns its file name|2|
*onTerminateApp=The event occurs every time after the process terminates, issuing a termination code to the stream (-1 - termination error, 0 - correct termination of the process, 1 - process destroyed)|2|
*onEndEnum=The event occurs at the end of the cycle of enumerating all processes|2|
*onFind=The event occurs whenever a process is successfully searched by its ID or name|2|
*onNotFind=The event occurs whenever the process is not found by ID or name|2|
*onGetPriority=Outputs the priority of the selected process to the stream (0 - medium, 1 - low, 2 - high, 3 - real time, 4 - below average, 5 - above average)|2|
*onGetProc=Outputs to the stream a mask of valid processors for the selected process (from 1 to n-processors in a bitmask)|2|
*onGetProcBoost=Outputs the boost values of the selected process to the stream (0 - no boost, 1 - boost)|2|
*onGetMemoryInfo=Outputs the memory size of the selected process in kilobytes to the stream|2|
*onGetProcessAccount=Outputs the username of the selected process to the stream|2|
*onGetCmdLine=Outputs the command line of the selected process to the stream|2|
*onCPUUsage=Outputs the percentage CPU load of the current process to the stream|2|
CurrentID=Contains the ID of the currently selected process|3|1
*CurrParentID=Contains the ID of the parent process that spawned the currently selected process|3|1
*CPUCount=Contains the number of processors in the system|3|1
*FullPath=Contains the full path to the file of the selected process|3|2
*MajorVersion=First digit of OS version|3|1
*MinorVersion=Second digit of OS version|3|1
*PriorityClass=Priority value (0 - medium, 1 - low, 2 - high, 3 - real time, 4 - below average, 5 - above average)|4|1
*AffinityMask=Bit mask of valid processors for the process|4|1
*PriorityBoost=Process boost resolution value (0 - disable boost, 1 - enable boost)|4|1
*Name=Search process name|4|2
ID=ID of the searched process|4|1
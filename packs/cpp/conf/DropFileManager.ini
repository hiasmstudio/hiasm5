[Methods]
doListen=Allows acceptance of dropped objects for control|1|
doStop=Prohibits acceptance of dropped objects for control|1|
onDrop=Occurs after objects are reset to the control and contains their names in the stream|2|
onDropEnd=Occurs after all objects have been reset and contains the number of reset objects in the stream|2|
*onDragEnter=Occurs when the mouse cursor enters the control and contains the state of the keys pressed in the stream.|2|
*onDragOver=Occurs while dragging over a control and contains the state of the pressed keys in the stream|2|
*onDragLeave=Occurs when the mouse cursor leaves the control or the user cancels the drag-and-drop operation|2|
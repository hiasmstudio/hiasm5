[Type]
Class=Element
Info=Loop with a given number of iterations
Tab=RTCG

[Property]
End=Sets the default value, when crossed, the loop is exited|1|0
Start=Sets the initial value of the default loop counter|1|0
IncludeEnd=False - loop with range [Start,End), i.e. right border is not included, True - loop with range [Start,End]|14|0|True,False
InData=True - take data from the stream, False - overlap data from the stream with empty data|14|1|True,False

[Methods]
doFor=Starts a loop with a counter|1|1
doStop=Premature stop of the cycle|1|0
onEvent=The event occurs every time the loop iterates|2|1
onStop=Event occurs at the end of the cycle|2|0
Position=Stores the current counter value|3|1
End=Defines the value that, when crossed, exits the loop|4|1
Start=Defines the initial value of the counter|4|1

[Type]
Class=Element
Info=Chart Value Series
Interfaces=PlotSeries

[Property]
Grapher=The chart on which you want to display the series|20|(empty)|Plotter
@Color=Series color|8|255
Size=Series Figure Size|1|1
Step=The amount of increment in the X value for each subsequent point|7|0
@MaxValues=The maximum number of points in a series after which, when adding a point, the first one will be deleted|1|0
Name=Series name|2|

[Methods]
doAdd=Adds a point to the series ARG(ValueY, ValueX)|1|0
doClear=Clears the series|1|0
*doShow=Enables/disables (1/0) series display|1|0
onAdd=The event occurs every time a value is added to the chart|2|0
*ValuesX=X axis array|3|0
*ValuesY=Array of Y axis values|3|0
*MinX=Minimum X series value|3|7
*MaxX=X-axis series maximum value|3|7
*MinY=Minimum series value along the Y axis|3|7
*MaxY=Maximum series value along Y axis|3|7
ValueY=Y value|4|7
ValueX=X-axis value|4|7
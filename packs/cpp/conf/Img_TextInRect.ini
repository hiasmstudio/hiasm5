[Type]
Class=Element
Info=Drawing text in a given rectangle
Tab=Graphics

[Handlers]
PointXY=Point1,Point2

[Property]
Point1=Default coordinates of the upper left corner of the rectangle|1|0
Point2=Default coordinates of the lower right corner of the rectangle|1|0
Point2AsOffset=Count the coordinates of the second point relative to the first (i.e. the second point is the length and height of the figure)|14|1|True,False
@DrawSource=Graphics output object: Bitmap - picture, Handle - window or Windows control, Context - device context|4|0|Bitmap,Handle,Context
@Font=The font in which the text will be drawn|15|
+Text=Output text|2|
##Offset=Indent text from rectangle edges
@OffsetLeft=Left text indentation|1|0
@OffsetRight=Text indentation|1|0 
@OffsetTop=Text indentation|1|0 
@OffsetBottom=Text indentation|1|0 
##
@AlignHorizon=Align text horizontally in a rectangle|4|0|Left,Right,Center
@Alignvertical=Align text vertically in a rectangle|4|0|Top,Bottom,Center
@WordBreak=Lines are automatically divided into words if a word extends beyond the edges of the rectangle|4|1|False,True 
@Ellipsis=Off - disabled; Word - cuts off any word that does not fit in the rectangle; Path - replaces characters in the middle of a line with a dash (if the line contains a backslash \) so that the result fits in the given rectangle; End - if the end of the line does not fit in the rectangle, it is cut off and dashes are added. If a word that is not at the end of the line goes outside the rectangle, it is truncated without a dash|4|1|Off,Word,Path,End
@RtlReading=Arranges the reading order from right to left for bidirectional text when the selected font is Hebrew or Arabic|14|0|False,True  
@NoPrefix=Disables processing of prefix letters. False - treats the prefix letter && as a directive to underline the letter following it, and the characters &&&& to display a single && (without underlining the next one)|14|0|False,True  
@SingleLine=Shows text on the screen only on a single line. Carriage returns and line feeds do not break lines|14|0|False,True

[Methods]
doDraw=Draws text in a rectangle with the top left corner at Point1 and the bottom right corner at Point2|1|
onDraw=The event occurs every time after text is drawn in a rectangle|2|
onTextRect=The event occurs before the text is drawn and outputs to the stream the size of the rectangle occupied by the text ARG(Left,Top,Width,Hight)|2|
Bitmap=Graphic output object on which you want to draw text in a rectangle|4|11
Text=Text displayed on the image|4|2
Point1=Coordinates of the upper left corner of the rectangle's border|4|1
Point2=Coordinates of the lower right corner of the rectangle border|4|1
*Transform=Transformation|4|1
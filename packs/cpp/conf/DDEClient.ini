[About]
Version=1.00
Author=tsdima
Mail=ts-dima@mail.ru

[Type]
Class=Element
Info=DDE client
Tab=System

[Property]
@ServiceName=DDE service name|2|
@TopicName=DDE topic name|2|
+@Items=List of DDE elements|5|
@AutoUpdate=A non-zero property value means onGetItem is automatically called when the item changes|1|0
@ServerApp=Path to the DDE server executable file. This file will be run if the first connection attempt fails|2|
@Timeout=doExecute timeout in milliseconds|1|3000

[Methods]
doOpenLink=Activation of DDE communication. After successful activation, other actions are possible, except changing the names of the service and topic|1|1
doCloseLink=Deactivating DDE communication|1|0
doGetItem=Query element value ARG(Name)|1|0
doPutItem=Set element value on server ARG(Name, Value)|1|0
*doExecute=Executing DDE command ARG(Command)|1|2
onOpenLink=The event occurs when a connection with the DDE server is successfully established ARG(NULL)|2|0
onCloseLink=The event occurs when communication with the DDE server is completed ARG(NULL)|2|0
onGetItem=Occurs after doGetItem or automatically when an element changes and outputs the value of the element ARG(ItemValue) to the stream|2|3
onPutItem=Occurs after doPutItem and outputs the result of the operation to the stream (0 - unsuccessful execution) ARG(Result)|2|0
*onError=The event occurs when there is an error in activating a connection or an error in executing the line ARG(ErrMsg)|2|0
*onExecute=The event occurs after the execution of a DDE command and outputs the result of the operation to the stream (0 - unsuccessful execution) ARG(Result)|2|0
ItemName=Name of the item passed to onGetItem|3|2
ItemIndex=Index of the item passed to onGetItem|3|1
Name=The name of the element that will be read by doGetItem or set by doPutItem|4|2
Value=The element value that will be set by doPutItem|4|2
[About]
Version=1.0
Author=Dilma

[Type]
Class=Element
Sub=Form
Info=Windows Clipboard Hook

[Property]
DataStream=none - the onChange event does not output any data to the stream, Text - the onChange event outputs text from the clipboard to the stream|4|1|none,Text
NextHook=True - pass control to the next hook, False - do not transfer (setting this value will prevent other programs from catching changes in the Clipboard)|4|0|True,False

[Methods]
doSetText=Writes text to the clipboard without generating onChange events (see Text)|1|
doPut=Pastes text from the clipboard into a Windows window with a given identifier, or into the active window with an identifier of 0 (imitation Ctrl+V)|1|
onChange=The event occurs whenever text is placed on the clipboard and outputs it to the ARG(Text) stream|2|2
onBitmap=The event occurs every time an image is placed on the clipboard and outputs this image to the stream ARG(Bitmap)|2|
Text=Determines the text to be placed on the clipboard using the doSetText method|4|2
*Handle=ID of the Windows window into which you want to paste the text|4|1
*LockHook=Overrides the work of the NextHook saint: if the received data is different from 0, it prohibits the transfer of data to the next hook, otherwise it unconditionally transmits|4|1
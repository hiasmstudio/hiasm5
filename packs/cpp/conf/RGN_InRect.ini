[Type]
Class=Element
Info=Checking whether a region is in a rectangle
Tab=Windows

[Handlers]
PointXY=Point1,Point2

[Property]
Point1=Coordinates of the upper left corner of the rectangle with PackPoint=True or X coordinate of this corner with PackPoint=False|1|0
Point2=Coordinates of the lower right corner of the rectangle with PackPoint=True or Y coordinate of this corner with PackPoint=False|1|0
Point2AsOffset=Count the coordinates of the second point Point2 (if PackPoint = True) relative to the first Point1 (i.e. the second point is the length and height of the figure)|14|1|True,False
PackPoint=Use packed coordinates Point1 and Point2 (if False, X = Point1, Y = Point2, Width, Height are used)|14|0|True,False
Width=Rectangle width with PackPoint=False|1|0
Height=Rectangle height with PackPoint=False|1|0

[Methods]
doCheck=Checks if a region is inside a rectangle|1|
onTrue=The event occurs every time when at least one point in the region is found in the rectangle|2|
onFalse=The event occurs whenever more than one point in the region does not fall inside the rectangle|2|
*onCheck=The event occurs after checking whether the region is included in the rectangle and produces: 0 - if it is not included, 1 - if at least one of the points of the region is included|2|
Result=Contains the result of checking whether the region is included in the rectangle (0 - the region is not included in the rectangle, 1 - if at least one of the points of the region is included)|3|1
Region=Defines the region|4|1
Point1=Coordinates of the upper left corner of the rectangle with PackPoint=True or X coordinate of this corner with PackPoint=False|4|1
Point2=Coordinates of the lower right corner of the rectangle with PackPoint=True or Y coordinate of this corner with PackPoint=False|4|1
*Width=Rectangle width with PackPoint=False|4|1
*Height=Rectangle height with PackPoint=False|4|1
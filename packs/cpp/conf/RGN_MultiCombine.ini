[Type]
Class=DPElement
Sub=,,,Count|Region
Info=Combines many regions
Tab=Windows
Icon=Mode

[Property]
Count=Number of combinable regions|1|2
@Mode=Region merging mode: AND - intersection, OR - union, XOR - union of regions, excluding any intersecting sections, DIFF - those parts of Region1 that are not parts of Region2 are merged, COPY - A copy of the region identified by the value of the Region1 parameter is created|4|0|AND,OR,XOR,DIFF,COPY

[Methods]
doCombine=Combines many regions into one|1|0
*doClear=Removes the region result of the combination (zeroes the Result)|1|0
onCombine=The event occurs whenever regions are combined and outputs the result to the ARG(Region) stream|2|0
Result=Contains the result of the combination|3|1
ResultIndex=Contains the index of the combination result (0 - error, 1 - empty region, 2 - simple (rectangular) region, 3 - complex (multiple rectangle) region)|3|1
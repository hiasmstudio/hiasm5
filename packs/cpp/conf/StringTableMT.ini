*doMT_ChkEMatrix=Reads the element(s) of a matrix of rows with the flags set by coordinates using MT streams, where the sequence of elements is (X - column index)(Y - row index). If the X parameter is negative, the entire line is output. With a negative Y parameter - the entire column|1|0
*doMT_SelEMatrix=Reads the selected element(s) of the row matrix by coordinates using MT streams, where the sequence of elements is (X - column index)(Y - row index). If the X parameter is negative, the entire line is output. With a negative Y parameter - the entire column|1|0
*doMT_ColorsStr=Sets the line text color and line color using MT streams, where the sequence of elements is (Row Index)(Row Text Color Index (if 0 - TextColor))(Row Color (if 0 - TextBkColor)). If -1 is passed as color parameters, the parameter will not change|1|0
*doMT_CheckBox=Unchecks/sets a checkbox using MT streams, where the sequence of elements is (Row index (-1 - all))(Mode (0 - hidden; 1 - cleared; 2 - checked))|1|0
*doMT_InsertIcon=Inserts an icon into the list of icons using MT streams, where the sequence of elements is (Index of the location of the icon in the list)(Icon). If the index parameter is greater than the length of the icon list, the icon is added to the end of the list|1|0
*doMT_ReplaceIcon=Replaces an icon in the list of icons using MT streams, where the sequence of elements is (Index of the location of the icon in the list)(Icon)|1|0
*doMT_LoadExtIcon=Extracts a separate icon from resource files (*.exe,*.dll,*.ocx,*.icl), and if there are no icons, extracts the one associated with the file, where the sequence of elements is (Resource file name)(Icon number to be extracted)(Icon size)(Replacement icon)|1|0
*doMT_FindText=Searches for (replaces) occurrences of text from a stream in a table (the method is not case sensitive), where the sequence of elements is (Search text)(Start line)(Start column)(Replacement text for ReplaceFind=True). The search is carried out from left to right and from top to bottom to the nearest occurrence|1|0
*doMT_FindNext=Processes and passes parameters to the doMT_FindText method to find (replace) the next occurrence of text|1|0
*doGetCol_MT=Gets a column from a table by index from a stream into an MT stream on onMT_GetCol|1|0
*doGetColors_MT=Gets the text color of the line and the color of the line by index from the stream to the MT stream on onMT_GetColors|1|0

*doIdxHighlight=Highlights/unilluminates the menu item ARG(Index, State)|1|0

MenuItemIdx=The event will occur when a menu item is clicked and outputs the ordinal index of this item to the stream (starts at 0)|2|0
*MenuItemName=The event will occur when a menu item is clicked and outputs the line of this item to the stream|2|0
*onKeyDown=The event occurs when a key is pressed while in the menu and outputs the key code to the stream|2|0
*onSelectItem=The event occurs when the user selects a menu item, before the MenuItemIdx event|2|0
*onNameItems=Displays the names of all menu items|2|0
*onCheckItems=Gives indexes of controlled menu items|2|0
*onVisibleItems=Returns indexes of visible menu items|2|0
*onEnabledItems=Returns indexes of allowed menu items|2|0
Handle=Returns the ID of the menu to be manipulated from other elements|3|1
*Count=Contains the number of menu items|3|1
Bitmaps=Array of pictures|4|13

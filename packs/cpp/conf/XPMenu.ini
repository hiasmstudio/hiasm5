*doVisibleItems=Queries the visibility status of menu items|1|0
*doEnabledItems=Queries the permission status of menu items|1|0
*doCheckIdx=Checks/unchecks a menu item with an index from a stream or Index field|1|0
*doEnablIdx=Enables/disables a menu item with an index from a stream or Index field|1|0
*doVisiblIdx=Shows/disables a menu item with an index from a stream or Index field|1|0
*doHighlight=Highlights/unhighlights a menu item with an index from a stream or Index field|1|0

*doIdxCheck=Checks/unchecks the ARG(Index, State) menu item|1|0
*doIdxEnabled=Enables/disables menu item ARG(Index, State)|1|0

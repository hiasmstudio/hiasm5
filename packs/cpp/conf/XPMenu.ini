[Property]
IconByIndex=Assigning icons by indexes (the index is set in the format: "<N1,N2,N3>" before the name of the menu item, where N1, N2, N3 are the numbers of icons in the icon array)|14|1|True,False
EndItemRight=Move the last main menu item all the way to the right|14|1|True,False
+Menu=Defines menu items (To skip an item, use the "-" sign with a dividing line displayed)|5|
ImgSize=Size of pictures in menu items. All images in the array will be reduced to this size|1|16
adWidth=Adding the width of the menu in pixels. Used for short menu items to improve visualization|1|0
@GutterLineOn=True - turns on the image area, False - disables|14|0|True,False
@LongSeparator=True - long separator, False - short separator|14|1|True,False
@Frame=True - draw a frame around the selection bar, False - do not draw|14|0|True,False
@FlatSelect=Flat selection indicator|14|0|True,False
@LineStyle=Image area gradient style|4|0|Standard,Inverse
@BumpText=True - embossed text effect on the gradient frame; False - normal text|14|1|True,False
@Shift=Shift the initial position of the image array (does not work when assigning images indexically)|1|0
Index=Default row index|1|0
@Font=Element font|15|

[About]
Version=1.25
Author=nesco

[Type]
Class=Element
Info=Independent timer, generates an onTimer event after a specified period of time
Tab=Controls

[Property]
Resolution=Timer accuracy (0 is the highest accuracy)|1|1
@Interval=Interval (in milliseconds) between timer iterations|1|1000
Enable=True - the timer starts working immediately after the application or service is launched, False - the timer is disabled|14|0|True,False
AutoStop=The timer will automatically turn off after the specified number of times. If equal to 0, then this field is ignored and the timer will run continuously. When the timer starts, the counter is reset|1|0

[Methods]
doTimer=Turn on the timer|1|
doStop=Turning off the timer|1|
*doAutoStop=Sets the value of the AutoStop property|1|
onTimer=The event occurs every time the next iteration of the timer (see Interval)|2|
*onStop=The event occurs once immediately after the timer stops|2|
*Enabled=Contains 1 if the timer is running, or 0 otherwise|3|1
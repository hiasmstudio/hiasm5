[Type]
Class=DPElement
Sub=,Count|onBit,,
Info=Checking the bits of a number

[Property]
Count=Number of bits checked|1|8
Data_0=Data output to the stream by Bit# events if this bit in a number is 0|3|
Data_1=Data output to the stream by Bit№ events if this bit in a number is equal to 1|3|
ZeroBits=True - trigger the Bit№ event for zero bits, False - do not trigger|14|0|True,False

[Methods]
doBits=Decomposes a number into bits|1|
doBitsRev=Decomposes a number into bits and outputs data in reverse order (from bottom to top)|1|
*doStop=Stops the decomposition of a number into bits|1|
Value=The number that needs to be decomposed into bits|4|1
[Type]
Class=Element
Info=Monitoring data changes in a stream

[Property]
+Data=Sets the initial value of the data in the component|3|

[Methods]
doData=Compares the data from the stream with the data of the component and if they are not equal, it remembers them and outputs them to the stream, otherwise it does nothing|1|
onData=The event occurs whenever data from the stream does not match the data in the component and outputs this data back to the stream|2|
*onNoData=The event occurs whenever data from the stream matches data in the component and outputs this data back to the stream|2|
Data=Defines data|4|
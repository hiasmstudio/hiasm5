[Type]
Class=Element
Info=Data compression/recovery using the LZMA algorithm
Tab=Files

[Property]
DictionarySize=Dictionary size for data recovery (from 0 to 28). It is calculated as D=2^N; subsequently, when decrypting, D bytes of memory (RAM) are required. 20 = 1Mb|1|20
NumFastBytes=Fastbytes order (5 to 273). Typically, a larger number gives a small increase in the compression percentage and slows down the encoding process|1|128
MatchFinder=Hash calculation algorithm|4|1|bt2,bt4,bt4b
Lc=Number of literal context bits|4|4|0,1,2,3,4,5,6,7,8
Lp=Number of literal pos bits|4|0|0,1,2,3,4
Pb=Number of pos bits|4|3|0,1,2,3,4
EndMarker=Write data about its termination to the end of the stream. If False, a record of its original size will be made in the stream header|14|1|True,False
ProgressInterval=Interval for generating an event informing about the status of encoding progress|1|50

[Methods]
doCompress=Compresses data ARG(Stream, DictionarySize, NumFastBytes, ProgressInterval)|1|
doDeCompress=Recovers data ARG(Stream, ProgressInterval)|1|
onStream=The event occurs every time after data is compressed/restored and returns it to the ARG(Stream) stream|2|
*onProgress=The event occurs after a specified ProgressInterval and outputs the number of the byte being encoded ARG(Progress) to the stream.|2|
*onProgressMax=The event occurs once before the stream starts encoding and displays its initial size ARG(ProgressMax)|2|
*onError=The event occurs when an error occurs and outputs its code to the ARG(Error) stream|2|
Stream=Defines the data area identifier|4|10
*DictionarySize=Dictionary size for data recovery (from 0 to 28)|4|1
*NumFastBytes=Fastbytes order (5 to 273)|4|1
*ProgressInterval=Interval for generating an event informing about the status of encoding progress|4|1
*DestSize=Contains the size of the data after the operation|3|1
*Position=Contains the current progress position while coding is running|3|1
*OriginalSize=Contains the size of the original data, updated immediately after encoding starts|3|1
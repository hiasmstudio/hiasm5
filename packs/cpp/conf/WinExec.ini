[About]
Version=2.20
Author=Dilma,NetSpirit

[Type]
Class=Element
Info=Launching external programs

[Property]
Param=Default application launch options|2|
FileName=Full path to the default file|2|
WorkingDir=The working directory for the program to be launched. The directory must exist. If not specified, the current application directory will be used|2|
Mode=Application launch mode|4|1|SW_HIDE,SW_NORMAL,SW_SHOWMINIMIZED,SW_SHOWMAXIMIZED,SW_SHOWNOACTIVATE,SW_SHOW,SW_MINIMIZE,SW_SHOWMINNOACTIVE,SW_SHOWNA,SW_RESTORE,SW_MAX
RunEvent=Action after launch: Async - immediate return of control to the program, Wait - waiting for the running process to complete|4|0|Async,Wait
Action=The action to be performed using the doShellExec method. Usually this is open. The most common actions are: edit, print, explore, properties, find (can be seen in Tools->Folder Options->File Types->file_type->book. Advanced)|2|open

[Methods]
doExec=Launches the application (see FileName)|1|
doShellExec=Opens a file in its associated program (see FileName)|1|
*doConsoleExec=Launches a console program|1|
*doConsoleInput=Passes a string to a console program|1|
*doConsoleTerminate=Forces termination of a console program|1|
*doRunCpl=Launches the Control Panel applet|1|
onExec=The event occurs if the program is successfully launched using the doExec method|2|
*onConsoleResult=Returns the result of executing a console program|2|
*onConsoleError=Returns error text as a result of executing a console program|2|
*onConsoleTerminate=The event occurs when the console program terminates|2|
FileName=Full path to the application|4|2
Params=Application launch options|4|2
*Action=Action to be performed using the doShellExec method (see Action property)|4|2
*WorkingDir=Working directory for the program to be launched|4|2
*ExitCode=Contains the process termination code after the program exits with Mode=Wait|3|1
*ProcessID=Contains the ID of the running process, or 0 if the process was not started for some reason|3|1
[Type]
Class=Element
Info=Signal about connection and disconnection of devices to ActiveSync

[Methods]
doStartMonitoring=Starts monitoring the moment the device connects to the system|1|
doStopMonitoring=Stops monitoring a device's connection to the system|1|
doSettings=Opens the ActiveSync connection settings dialog|1|
onNotify=The event occurs when a device is connected/disconnected and is output to the stream: 0 - when the device is disconnected, 1 - when the connection to the device is successful and an IP is assigned to it, 2 - when the device identification begins, 3 - when the device responds to the identification request, 4 - when the connection to the device is successful, until an IP address is assigned to it, 5 - during the connection termination process, 6 - when the ActiveSync connection manager is closed, 7 - when the connection error occurs. with device|2|
Connected=Contains 1 if there is a connection with a Win CE device, and 0 otherwise|3|1
RemoteIP=IP address assigned by the system when connecting a Win CE device to communicate with it|3|2
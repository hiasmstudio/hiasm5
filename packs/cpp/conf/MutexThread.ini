[Type]
Class=Element
Info=Synchronized parallel thread
Tab=System

[Property]
@Delay=Delay between iterations in milliseconds|1|1000
FastStop=Stop the thread immediately after the first iteration|14|1|True,False
BusyEvent=Reaction to calling the doStart method when a thread is already running|4|0|Ignore,Restart
OneWaitSyncExec=Single/cyclic event output in standby mode|14|1|True,False
PrefixName=Prefix in the name of the security mutex|2|
@Mutex=Enables/disables mutually exclusive access blocking|14|1|True,False

[Methods]
doStart=Starts a thread for execution|1|
doStop=Stops the thread completely and waits for it to complete|1|
*doStopFlag=Sets the thread termination flag (immediately returns control to the program)|1|
*doSuspend=Suspends the execution of a thread|1|
*doResume=Resumes execution of a thread|1|
onExec=The event occurs only when the thread is running with a delay between iterations equal to Delay|2|
onSyncExec=Same as the onExec event, only synchronized with the main thread|2|
*onWaitSyncExec=Same as the onExec event, only synchronized with the main thread in standby mode|2|
*onWaitqueue=The event occurs when a thread enters queue waiting mode|2|
*onSuspend=The event occurs whenever a thread is suspended.|2|
*onResume=The event occurs whenever the thread is resumed.|2|
Busy=Contains 1 if the thread is running, 0 otherwise|3|1
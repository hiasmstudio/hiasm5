[Type]
Class=Element
Info=Desktop switch
Tab=System

[Property]
@Alt=If Down, then additionally press Alt for a key combination|4|0|None,Down
@Ctrl=If Down, then additionally press Ctrl for the key combination|4|0|None,Down
@Shift=If Down, then additionally press Shift for a key combination|4|0|None,Down
@Win=If Down, then additionally press Win for the key combination|4|1|None,Down
DSK=Default desktop number|1|1

[Methods]
doStartDSKSwitch=Launches the desktop switcher. HotKeys (hot keys) - selected combinations of Alt, Ctrl, Shift, Win + 1..5. ARG(StartDSK)|1|
doStopDSKSwitch=Stops desktop switcher|1|
doDSKSwitch=Switches desktops. ARG(NumberDSK)|1|
onStartDSKSwitch=The event occurs whenever the switch is fired, throwing an error code to the stream. 0 - successful launch, 1 - impossible to create a handler class, 2 - impossible to create a handler window, 3 - impossible to register HotKeys. ARG(Error)|2|
onDSKSwitch=The event occurs whenever the active desktop changes, outputting the new desktop number to the stream. ARG(NumberDSK)|2|
DSK=Desktop number|4|1
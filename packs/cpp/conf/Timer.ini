[Type]
Class=Element
Info=Generates an onTimer event after a specified period of time
Tab=Controls

[Property]
@Interval=Interval (in milliseconds) between timer iterations|1|1000
Enable=True - the timer runs after the program starts, False - the timer is disabled|14|0|True,False
@AutoStop=The timer will automatically turn off after the specified number of times. If equal to 0, then this field is ignored and the timer will run continuously. When the timer starts, the counter is reset.|1|0
OverCall=Reaction to a timer event that occurs BEFORE the end of the onTimer/onStop events (which is possible when the windows message handler is launched by these events). Ignore - ignore (without changing the counter for AutoStop), Defer - defer calling the event until the end of previous calls|4|0|Ignore,Defer

[Methods]
doTimer=Includes timer|1|0
doStop=Turns off the timer|1|0
*doStopAll=Turns off the timer and resets the deferred event counter when OverCall=Defer|1|0
onTimer=The event occurs every time the next iteration of the timer (see Interval)|2|0
*onStop=The event occurs once and immediately after the timer stops|2|0
*Enabled=Contains 1 if the timer is running, or 0 otherwise|3|1
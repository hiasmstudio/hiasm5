[Type]
Class=Element
Info=Allows you to protect parts of a scheme when shared between multiple threads

[Property]
Name=Mutex name|2|

[Methods]
doCreateMutex=Creates a Mutex by name from the thread or Name field. If creation is successful, the onCreated event occurs; if there is already one with the same name, then - onAlreadyExists, otherwise - onError|1|
doCreateAndRelease=Creates a Mutex, raises an event, and destroys the Mutex|1|
doReleaseMutex=Releases Mutex|1|
doOpenMutex=Opens Mutex|1|
onCreated=The event occurs when a Mutex is successfully created|2|
onAlreadyExists=The event occurs when a Mutex with the same name is detected in the system|2|
onReleased=The event occurs after the Mutex is successfully released|2|
onOpened=The event occurs when the Mutex is successfully opened|2|
*onError=The event occurs in case of an error, outputting its number to the thread|2|
*Handle=Handle Mutex|3|1
Name=Mutex name|4|1
[Type]
Class=Element
Info=Changes the case of characters in a string
Tab=RTCG

[Property]
Type=Lower - convert the string to lowercase, Upper - convert the string to uppercase, ProperCase - convert the first letter of each word in the string to uppercase|4|0|Lower,Upper,ProperCase

[Methods]
doModify=Converts the string SrcStr to the case specified by the Type parameter|1|0
onModify=The event occurs every time a string is processed and outputs the result of the conversion to a stream|2|2
Result=Contains the result of the transformation|3|2
SrcStr=Specifies the string to be converted|4|2

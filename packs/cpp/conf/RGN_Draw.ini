@DrawSource=Graphics output object: Bitmap - picture, Handle - window or Windows control, Context - device context|4|0|Bitmap,Handle,Context
@UseOffsetFill=Shift the fill (picture with PatternStyle = True or dashed lines, for example Style = bsVertical): False - no shift, True - shift the fill to the beginning of drawing, FromOffsetFill - shift by the value from the OffsetFill point|4|0|False,True,FromOffsetFill
@PatternStyle=Filling a region with a Pattern image and shifting the image by the OffsetFill value. True - fill the figure with an image; if there is no image, the figure is not filled, False - fill the figure with the Style fill style|14|1|True,False
@Style=Region fill style: bsClear - no fill, bsSolid - Color, bsHorizontal - horizontal lines, bsVertical - vertical lines, bsFDiagonal - descending stroke from left to right, bsBDiagonal - ascending stroke from left to right, bsCross - grid, bsDiagCros - diagonal grid|14|1|bsClear,bsSolid,bsHorizontal,bsVertical,bsFDiagonal,bsBDiagonal,bsCross,bsDiagCross
@Outline=Draw the outline of a region with a line|14|1|False,True
@Transparent=Draw only lines (transparent background) when filling the region with dashed lines Style = bsHorizontal, etc.|14|0|False,True

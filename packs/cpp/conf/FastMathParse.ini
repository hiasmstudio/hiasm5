[About]
Version=1.0
Author=Galkov
Mail=Galkov@inbox.ru

[Type]
Class=DPElement
Sub=,,,DataCount|X
Info=Parsing and evaluating mathematical expressions

[Property]
DataCount=Number of arguments (numbered from %1 to %DataCount, %0 is the value of the result of the previous calculation)|1|2
+@MathStr=Formula line|2|%1 +  2*%2*%2 + 10
ResultType=Defines the type of the result|4|1|Integer,Real
@Default=Initial result values|7|0
@AngleMode=Units for trigonometric functions|4|0|Radians,Degrees

[Methods]
doCalc=Evaluates a mathematical expression|1|
*doClear=Sets the initial values of the result|1|
onResult=Outputs the calculation result to the stream|2|
*onError=The event occurs whenever there is an error in the operation of the component: 0 - syntax error, 1 - error in calculations|2|
*onDebugStrings=Stream of debug lines (for debugging only, or curiosity)|2|
Result=Contains the result of calculating a mathematical expression (in case of an error - NULL)|3|
*reCalc=An alternative call to a new calculation (the data below is equal to the data from the stream)|3|1
*PosErr=Error position in line (-1 - no error)|3|1
*Proc=Result of code generation (for debugging or curiosity only)|3|2
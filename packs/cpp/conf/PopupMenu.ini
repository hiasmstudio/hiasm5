[About]
Version=1.20
Author=Dilma & nesco

[Type]
Class=Element
Sub=Form
Info=Popup context menu

[Property]
+Menu=Defines menu items (the - sign is used to skip an item)|5|
TranspIcon=True - enable transparency of pictures, False - do not enable|14|0|True,False

[Methods]
doPopupHere=Expands the menu at the point where the cursor is located|1|
doPopup=Expands the menu at the point whose coordinates are contained in the stream in the format Y*65536 + X|1|
doAddItem=Adds a new menu item (the - sign is used to skip an item)|1|
doClear=Removes all menu items|1|
onClick=The event occurs when a menu item is clicked and outputs the ordinal index of this item to the stream (starts at 0) ARG(Index)|2|1
*onSelectStr=The event occurs when a menu item is clicked and outputs the line of this item ARG(Caption) to the stream.|2|2
*onEndPopup=The event occurs every time after the dropdown is closed and before onClick/onSelectStr|2|
Handle=Returns the ID of the menu to be manipulated from other elements|3|1
*Bitmaps=Array of pictures|4|13
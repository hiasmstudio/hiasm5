[Type]
Class=Element
Info=Loading and storing binary data in memory

[Property]
+Stream=Defines default memory data|10|

[Methods]
doCopy=Copies binary data into memory|1|
*doPosition=Sets the byte number to the value from the stream from which data reading/writing begins|1|
doClear=Clears data from memory|1|
*doSize=Changes the allocated memory size to the value from the stream. When zero is equivalent to doClear|1|
onCopy=The event occurs every time the data is copied and outputs it back to the ARG(Stream) stream|2|
Stream=Contains the data identifier for working with it|3|10
Size=Contains the size of the data in bytes|3|1
*Memory=Contains a pointer to the memory area (to the first byte of memory)|3|1
*Position=Contains the position of the current byte in memory|3|1
SrcStream=Specifies data to be copied into memory|4|10
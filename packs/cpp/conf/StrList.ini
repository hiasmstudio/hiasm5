[About]
Version=1.31
Author=Dilma & nesco

[Type]
Class=Element
Info=List of strings

[Property]
FileName=File name to load/save the list|2|
AddType=Last - add a new line to the end of the list, First - to the beginning|4|0|Last,First
+Strings=Adds lines from this parameter to the list when loading the program|5|

[Methods]
doAdd%AddType%=Adds a string to the list from a stream or str field|1|
doClear=Clears the list|1|
doDelete=Removes a row from the list by index from the stream (0 is the first row)|1|
doText=Initializes the list with strings in the form: <String1,String2,...>|1|
doLoad=Loads a list of strings from a file|1|
doSave=Saves a list of strings to a file|1|
*doAppend=Appends a list of strings to a file|1|
*doAppendText=Initializes the list with strings in the form: <String1,String2,...> and appends it to the existing string list|1|
*doSort=Sorts a list of strings|1|
*doInsert=Inserts a row into the list at index from the stream (0 is the first row)|1|
*doReplace=Replaces a string in a list by index from the stream (0 is the first string)|1|
*doMove=Moves a row from position IdxCur to position IdxNew ARG(IdxCur, IdxNew)|1|
*doSwap=Swaps rows with indexes Idx1 and Idx2 ARG(Idx1, Idx2)|1|
*doGetIndex=Gets the index of a string by name from a stream or StrToFind field|1|
*doGetString=Gets a row by index from a stream or IdxToSelect field|1|
*doLoadFromStream=Loads a list of strings from a file stream|1|
*doSaveToStream=Stores a list of strings in a file stream|1|
onChange=The event occurs whenever the list of strings changes|2|
*onGetIndex=Returns the row index obtained by the doGetIndex method|2|
*onGetString=Returns the string obtained by the doGetString method|2|
Text=Stores a list of strings separated by characters 10 and 13|3|2
Count=Stores the number of rows in the list|3|1
*EndIdx=Contains the index of the last row in the list|3|1
*Index=Stores the index of the found string|3|1
*String=Stores the selected row|3|2
Array=Access any list element by its index (see Array component)|3|13
Str=String to add to list|4|2
FileName=File name to load/save the list|4|2
*Stream=File stream ID|4|10
*StrToFind=Search string|4|2
*IdxToSelect=Index to get the string|4|1
*IdxCur=Current row index for doMove method|4|1
*IdxNew=New row index for doMove method|4|1
*Idx1=Index of the first row for the doSwap method|4|1
*Idx2=Index of the second line for the doSwap method|4|1
onEndPlay=The event occurs every time the file is played (excluding forced stop using the Stop and Pause methods)|2|
Position=Contains the position of the current file playback location (in milliseconds)|3|1
Length=Contains the length of the file being played (in milliseconds)|3|1
FileName=Specifies the name of the file being played|4|2

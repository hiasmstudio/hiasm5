[Type]
Class=Element
Info=FTP via WinAPI

[Property]
Host=FTP server name|2|
Username=Username|2|
Password=Password|2|
Port=Port|1|21
@Directory=Current folder on the server|2|
RemoteName=File name on the server to write/read|2|
TimeFormat=Defines the date output format: D - day of the month, W - day of the week, M - month, Y - year, h - hours, m - minutes, s - seconds|2|D[W]-M-Y (h:m:s)

[Methods]
doOpen=Opens an FTP session with the server|1|
doClose=Closes the FTP session|1|
doReadFile=Reads a file from an FTP server|1|
doWriteFile=Writes a file to an FTP server|1|
*doDelete=Deletes a file from the FTP server|1|
*doRename=Renames a file on the FTP server|1|
*doFindFile=Searching for files in the current directory on an FTP server|1|
*doCreateDirectory=Creates a folder on the FTP server with the name from the stream|1|
*doRemoveDirectory=Removes an empty folder on the FTP server with the name from the stream|1|
*doGetCurrentDirectory=Gets the name of the current folder on the FTP server|1|
onError=The event occurs every time after a component operation error and outputs its number to the stream|2|
onRead=Event occurs after reading a file from the server|2|
*onWrite=The event occurs after a file is written to the server|2|
*onReadProgress=The event occurs every time the next block of data is read and displays the number of bytes received|2|
*onWriteProgress=The event occurs every time a data block is written and displays the number of bytes written|2|
*onConnect=The event occurs when a successful connection to the server|2|
*onFindFile=The event occurs if the next file is found, outputs the found file to the stream|2|
*onEndFind=Event occurs after search completes|2|
*onGetCurrentDirectory=The event occurs after receiving the name of the current folder on the FTP server and outputs this name to the stream|2|
*FoundIsDirectory=Indicator that the found name is a subdirectory (1 - yes, 0 - no)|3|1
*FoundFileName=Name of the found file|3|2
*FoundFileSize=Found file size|3|2
*FoundDateCreate=File creation date|3|2
*FoundDateLastWrite=Date of last entry to the file|3|2
*CurrentDirectory=Contains the name of the current folder on the FTP server after executing the doGetCurrentDirectory method|3|2
LocalName=File name or stream identifier (Stream)|4|2
RemoteName=File name on FTP server|4|2
*NewRemoteName=New file name on the FTP server for the doRename method|4|2
*Host=FTP server name|4|2
*Username=Username|4|2
*Password=Password|4|2
*Mask=File search mask|4|2
[Type]
Class=Element
Info=Time counter

[Property]
Precision=Measurement accuracy and output unit|4|0|Millisecond,Microsecond
[Methods]
doStart%Precision%=Remembers the current time value|1|
doStop%Precision%=Calculates the difference between the current and saved time|1|
onStart=The event occurs every time the current time is saved|2|
onStop=The event occurs every time after receiving a time difference and outputs it to the stream|2|

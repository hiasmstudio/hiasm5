[Methods]
doOpen=Opens the CD cover|1|
doClose=Closes the CD cover|1|
*doLock=Locks the Eject button, making the CD door impossible to open|1|
*doUnlock=Unlocks the Eject button|1|
*doAudioCDPlay=Starts an Audio CD to play from the first track through the computer's audio system|1|
*doAudioCDStop=Stops Audio CD|1|
isCDInside=Contains 1 if there is currently a readable disk in the CD-ROM, and 0 otherwise|3|1
*Label=Contains the disc label or 'Audio CD' string for audio discs|3|2
*getDisk=Looks up the letter of the first CD and returns it. If the CD is not installed, then * is returned|3|2
Disk=Specifies the drive letter|4|2
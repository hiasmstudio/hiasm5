[About]
Version=1.0
Author=Dilma

[Type]
Class=Element
Info=Returns the position of occurrence of one string within another

[Property]
Target=Contains a default string whose occurrence position must be found|2|
StartPos=Contains the default search starting position|1|1
ZeroPos=True - the onSearch event occurs if the row is not found. False - the onSearch event does not occur if the row is not found|4|1|True,False
ShortSearch=Indicates a cyclic search for all occurrences of the Target string in the Str string (i.e., with each subsequent search, the occurrence is searched not with StartPos, but with Position).|4|0|True,False

[Methods]
doSearch=Searches for the Target string in the Str string, starting from the StartPos position, and outputs the position of the found string to the stream|1|
*doReset=Resets internal search position when ShortSearch=True|1|
onSearch=The event occurs whenever the search is completed|2|
Position=Stores the position of the found occurrence of the string Target in the string Str|3|1
Str=Specifies the string to be searched for|4|2
Target=Specifies the string whose occurrence position is to be found|4|2
StartPos=Defines the starting position of the search|4|1
[Property]
IconToBmp=True - convert icons to BMP format when calling the doGetIcon method, False - do not convert|14|1|True,False
@TranspColor=Fill color of transparent areas of the icon when converting to BMP format|8|clBtnFace
IconFileName=File name for loading and saving the icon|2|
IconsFileName=File name (*.exe,*.dll,*.ocx,*.icl) to import icons into the list|2|
IListFileName=File name to load and save the list of icons|2|
IconsManager=Icon manager|20|(empty)|Icons

[Methods]
*doMT_InsertIcon=Inserts an icon into the list of icons. If the index is greater than the length of the list of icons, the icon is added to the end of the list ARG(Index, Icon)|1|0
*doMT_ReplaceIcon=Replaces an icon in the list of icons. ARG(Index, Icon)|1|0
*doMT_LoadExtIcon=Extracts an individual icon from a resource file (*.exe,*.dll,*.ocx,*.icl), and if there are no icons, extracts the one associated with the file, where ARG(IconsFileName, ExtractIndex, IconSize, ReplaceIcon)|1|0

doClearIcons=Clears the list of icons|1|0
*doDeleteIcon=Removes an icon from the list of icons by index from the stream. ARG(Index)|1|0
*doGetIcon=Retrieves an icon from a list of icons by index from the stream. ARG(Index)|1|0
*doLoadIcon=Loads an icon from a file, inserting it into the list with an index from the stream; if the index is greater than the length of the list, then inserts it at the end of the list. ARG(IconFileName, Index)|1|0
*doSaveIcon=Saves an icon with an index from a stream to a file. ARG(IconFileName, Index)|1|0
*doCountPakIcons=Gets the number of icons in a resource file (*.exe,*.dll,*.ocx,*.icl), outputting the resulting value to the stream. ARG(IconsFileName)|1|0
*doLoadPakIcons=Imports icons from a resource file (*.exe,*.dll,*.ocx,*.icl) into the icon list. ARG(IconsFileName)|1|0
*doLoadIList=Loads a list of icons from a file. ARG(IListFileName)|1|0
*doSaveIList=Saves a list of icons to a file. ARG(IListFileName)|1|0

onChangeImgLst=The event occurs whenever the list of icons changes|2|0
*onCountPakIcons=The event occurs every time after the number of icons in a resource file is obtained using the doCountPakIcons method. ARG(IconCount)|2|0
*onGetIcon=Outputs to the stream the icon obtained by the doGetIcon method, taking into account the IconToBmp property. ARG(Icon or Bitmap)|2|0
*onExtIcon=Outputs to the stream the icon obtained by the doMT_LoadExtIcon method, taking into account the IconToBmp property. ARG(Icon or Bitmap)|2|0

IconArray=Icon array|3|13
CountIcons=Contains the number of icons in the icon list|3|1
*EndIdxIcons=Contains the index of the last icon in the icon list|3|1
*ImgSize=Contains the size of icons in the icon list|3|1
*CountPakIcons=Contains the number of icons in the resource file. The value is valid after calling the doCountPakIcons method|3|1
*TranspColor=Contains the fill color of transparent areas of the icon when converting to BMP format|3|1

*IconFileName=File name for loading and saving the icon|4|2
*IconsFileName=File name (*.exe,*.dll,*.ocx,*.icl) for loading icons|4|2
*IListFileName=File name to load and save the list of icons|4|2
*SFileExists_MT=If this point contains 0 when saving to a file, the save operation continues; otherwise it is canceled. ARG(File operation code (3 - SaveIcon, 6 - SaveIList), File name)|4|0
*LFileExists_MT=If the file being loaded is missing, fires an event to generate a message and then cancels the load operation. ARG(File operation code (2 - LoadIcon, 4 - LoadPakIcons, 5 - LoadIList, 7 - LoadExtIcon), File name)|4|0
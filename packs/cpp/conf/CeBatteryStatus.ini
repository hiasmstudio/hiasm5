[Type]
Class=Element
Info=Returns information about the device's battery status

[Property]
DataFromDriver=True - request data from the device driver, False - take data from the cache|14|1|True,False

[Methods]
doRefresh=Updates battery status information|1|
onRefresh=The event occurs every time the battery status information is updated|2|
BattLifePercent=Contains the percentage of battery charge (0-100), or 255 if it is impossible to determine the charge level|3|1
BattLifeTime=Remaining operating time (in seconds), or -1 if it cannot be determined|3|1
BattFullLifeTime=Operating time when fully charged (in sec.), or -1 if it is impossible to determine|3|1
*BattFlag=Contains a battery status flag: 1 - high charge level, 2 - low charge level, 4 - critical charge level, 8 - battery in the process of charging, 128 - no battery, 255 - unknown status|3|1

[Type]
Class=Element
Info=Switch

[Property]
DataOn=Defines data for the default On state|3|
DataOff=Defines data for the default Off state|3|
Default=Switch initial state|4|1|On,Off

[Methods]
doSwitch=Switches the state from On to Off or vice versa from Off to On|1|
doReset=Resets a component to the Off state|1|
*doOn=Switches to On state|1|
*doCheck=Checks the state of the Switch - onSwitch does not occur, but one of the events will occur: onOn or onOff |1|
onSwitch=The event occurs after a state change and outputs DataOn in the On state or DataOff in the Off state to the stream.|2|
*onOn=The event occurs whenever the component transitions to the On state and issues DataOn to the stream|2|
*onOff=The event occurs whenever the component goes into the Off state and outputs DataOff to the stream|2|
*State=Contains the current state of the key: DataOn in the On state or DataOff in the Off state.|3|
*DataOn=Defines data for the On state|4|
*DataOff=Defines data for the Off state|4|
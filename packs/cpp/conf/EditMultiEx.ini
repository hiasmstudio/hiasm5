[About]
Version=1.0
Author=Dilma

[Type]
Class=EditMultiEx
Info=MultiElement component editor

[Property]
WorkCount=Number of methods|5|
EventCount=Number of events|5|
VarCount=Number of scheme variables|5|
DataCount=Number of data entry points|5|
Width=Component width in editor|1|300
Height=Height of the component in the editor|1|200
VOffset=Indentation of points from the top edge|1|0
HOffset=Indentation of points from the left edge|1|0

[Methods]
*##add=Adds a new copy of the scheme to the array and sets it to the current one|1|
*##select=Sets the current scheme whose index is specified in the stream|1|
*##delete=Removes from the array the scheme whose index is specified in the stream. In this case, the current scheme is not installed|1|
*##clear=Removes all schemes from an element|1|
*##hselect=Sets the current scheme whose ID is specified in the stream|1|
*##hdelete=Removes from the array the scheme whose identifier is specified in the stream. In this case, the current scheme is not installed|1|
*##count=Contains the number of elements in the array|3|1
*##index=Contains the index of the current scheme in an array|3|1
*##handle=Contains the current scheme identifier|3|1
*##eventIndex=Contains the index of the current scheme, the source of the event|3|1
*##eventHandle=Contains the identifier of the current scheme, the source of the event|3|1
[Type]
Class=Element
Info=Replaces all substrings matching a regular expression with the given ones
Tab=Strings

[Property]
+Expression=Regular expression used to search for substrings|2|
ReplaceStr=The string to which each substring found in SourceStr is replaced. Using the notation $n, where n is the number of the found subgroup of the regular expression, you can substitute this very found subgroup into the resulting string|2|

[Methods]
doReplace=Replaces all substrings in SourceStr with ReplaceStr|1|0
onReplace=The event occurs after doReplace is called and outputs the result of the replacement to the stream.|2|0
SourceStr=The line to be replaced|4|2
*Expression=Defines a regular expression|4|2
*ReplaceStr=Specifies the string to be replaced with|4|2
Result=Contains the replacement result|3|0

[About]
Version=2.20
Author=Dilma & nesco

[Type]
Class=Element
Info=Reading and writing data to the Windows registry

[Property]
@HKey=Branch ID|4|0|CLASSES_ROOT,CURRENT_USER,LOCAL_MACHINE,USERS,CURRENT_CONFIG
Key=Key (for example, "Software\ProgramName")|2|
Value=Key parameter name|2|
DataType=Type of data read|4|1|Integer,String,Real,Stream
NotEmpty=If True: generate the onRead event only if reading this parameter from the registry is possible (i.e. it exists). If False, the event is generated anyway.|14|0|False,True
+Data=Default data|2|

[Methods]
doRead=Reads data|1|
doWrite=Writes data|1|
*doDeleteValue=Removes a key setting from the registry|1|
*doDeleteKey=Removes a key from the registry|1|
*doEraseKey=Clears the key|1|
*doEnumKeys=Searches for all keys of the current key and outputs them to the stream|1|
*doEnumValues=Searches for all parameters of the current key and outputs them to the stream|1|
*doExistsKey=Checks the presence of a subkey in the current key|1|
*doExistsValue=Checks the presence of a parameter in the current key|1|
*doStopEnum=Stops enumeration of keys or parameters|1|
onRead=The event occurs after the data has been read and outputs the read data to the stream.|2|
*onEnumKey=The event occurs after the next key is found and outputs it to the stream|2|
*onEnumValue=The event occurs after the next parameter is found and outputs it to the stream|2|
*onExistsKey=The event occurs every time after checking for the presence of a subkey and returns 1 if it was found and 0 otherwise|2|
*onExistsValue=The event occurs every time after checking for the presence of a parameter and returns 1 if it was found and 0 otherwise|2|
RData=Contains registry data for the specified key|3|
Data=Specifies the data to be written to the specified registry key|4|
Key=Defines a registry key|4|2
Value=Defines a key parameter|4|2
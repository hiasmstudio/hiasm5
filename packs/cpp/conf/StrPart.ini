[Type]
Class=Element
Info=Splits a string into parts separated by a given character

[Property]
+Char=Separator character|2|
DirectEvent=True - onPart is issued after onSplit, False - onSplit is issued after onPart|14|1|True,False 

[Methods]
doSplit=Divides a string into parts (for example, the string "Left=120" with a Char property of "=" will be split into "Left" and "120")|1|0
onSplit=The event occurs after the left side of the string has been separated and outputs its right side to the stream.|2|0
onPart=The event occurs immediately after the line is split, before the onSplit event with DirectEvent=False, or after the onSplit event with DirectEvent=True and outputs its left part to the stream|2|0
*onNotFound=The event occurs when there is no delimiter character in the line|2|0
*Left=Contains the left side of the expression|3|2
*Right=Contains the right side of the expression|3|2
Str=Specifies a string to split into parts|4|2
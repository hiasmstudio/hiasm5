[Type]
Class=Element
Info=Testing a key combination

[Property]
Shift=Shift key state: none - do not check, Down - check for pressing, Up - check for releasing|4|0|None,Down,Up
Ctrl=State of the Ctrl key: none - do not check, Down - check for pressing, Up - check for releasing|4|0|None,Down,Up
Alt=Alt key state: none - do not check, Down - check for pressing, Up - check for releasing|4|0|None,Down,Up
Key=Default mask key code|1|0

[Methods]
doCheckMask=Checks the keys pressed in the specified mask (see Key)|1|
onFalse=The event occurs when there is a mismatch with the mask and outputs the key code to the stream|2|
onTrue=The event occurs when the mask is matched|2|
Key=Defines the key code to compare with the mask|4|1
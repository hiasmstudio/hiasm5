Mode=File access mode: ReadWrite - reading/writing (without the possibility of appending) data from a file, Write - writing (with the possibility of appending) data to a file|4|0|ReadWrite,Write

[Methods]
doOpen=Opens a file and creates a projection file for it ARG(FileName, CoreName, Offset, Size, PageMem)|1|0
doRemapping=Recreates a file projection. Works only in ReadWrite mode ARG(Offset)|1|0
doClose=Closes the projection file|1|0
doPosition=Sets the byte number to the value from the stream from which data reading/writing begins|1|0
onOpen=The event occurs whenever a projection file is created, outputting its size ARG(SizeMMF) to the stream.|2|0
onRemapping=The event occurs whenever a projection file is recreated, outputting its new size ARG(ReMapSizeMMF) to the stream.|2|0
FileName=File name|4|2
CoreName=Projection file name|4|2
Offset=Offset from the beginning of the file in bytes|4|7
Size=The size of allocated memory for the projection file in bytes in Write mode. In ReadWrite mode, the size is taken as a multiple of the system one.|4|1
*PageMem=Number of pages of allocated memory for the projection file|4|1
Stream=Contains the projection file data identifier for working with it|3|10
Memory=Contains a pointer to the memory area (to the first byte of memory in the projection file)|3|1
SizeMMF=Contains the current size of the projection file in bytes|3|1
*PageMMF=Contains the number of pages multiple of allocated memory|3|1
*CountFileBlock=Contains the reduced number of memory blocks to the size of the file being opened|3|
*CurOffsetBlock=Contains the current offset block|3|
*Position=Contains the position of the current byte in memory|3|1
*FileSize=Contains the size of the associated file in bytes|3|
*FileOffset=Contains the current offset from the beginning of the file in bytes|3|
*Granularity=Contains a multiple of the system memory block size|3|1
[About]
Version=1.10
Author=Dilma

[Type]
Class=Element
Info=Finding text between two lines or characters

[Property]
IncludeBlock=Determines whether to insert start and end block characters into the found string|14|0|True,False
Delete=Defines the action on the found block. True - the found block is deleted if the ReplaceStr field is empty, or replaced otherwise. False - do nothing|14|1|True,False
@ReplaceStr=Contains the string with which the found block will be replaced (used only when Delete = True)|2|
UserReplace=True - Allows user replacement of the found block using an external Replace field (only used when Delete = True)|14|1|True,False
@StartBlock=Defines block start characters|2|
@EndBlock=Specifies end-of-block characters|2|

[Methods]
doSearch=Starts searching for blocks in a string|1|
*doStop=Stops search/replace until replacement can be performed|1|
onSearch=The event occurs every time the next block is found and outputs the found block to the stream|2|
onEndSearch=The event occurs whenever the search is completed|2|
*onNotFind=The event occurs whenever a block cannot be found|2|
Text=Specifies the string in which blocks are searched|4|2
Replace=When replacing a block, this field is checked for equality 0, and if it is not equal to 0, then the block is replaced with the string ReplaceStr, otherwise not|4|2
InputMT=Using data from the stream: Head - to the head of the stream, Tail - to the tail of the stream, Nul - equivalent to NULL input data, Standard - standard data receiving|4|2|Head,Tail,Null,Standart

[Methods]
doAdd%InputMT%=Adds data to a multidimensional stream|1|
onAdd=The event occurs after data has been added and outputs it to the stream|2|
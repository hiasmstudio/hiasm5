[Type]
Class=Element
Info=Copying a folder or file

[Property]
AllowUnDo=True - the folder or file being deleted will be placed in the trash|4|0|False,True
FilesOnly=True - the operation will be performed only with files if Source is set to "*.*"|4|0|False,True
MultiDestFiles=True - indicates that each source file has its own destination directory in the Dest field|4|0|False,True
NoConfirmation=True - responds “Yes to all” to all internal requests during the operation|4|0|False,True
NoConfirmMKDir=True - does not create new directories if the operation requires them to be created|4|0|False,True
NoErrorUI=True - does not call the user interface on errors|4|0|False,True
RenameOnCollision=True - if a file with the given name already exists, a file with the name "Copy #N of..." is created|4|0|False,True
Silent=True - do not show dialog with progress bar|4|0|False,True
SimpleProgress=True - show a dialog with a progress indicator (if Silent=False), but do not show file names|4|0|False,True

[Methods]
doCopy=Copies the Source folder or file to Dest|1|
doMove=Moves the Source folder or file to Dest|1|
doDelete=Deletes the Source folder or file|1|
*doRename=Renames the Source folder or file|1|
*doExists=Checks the presence of a folder or file named Source on the disk and issues in the onOK stream: 1 - if the folder exists, 2 - if the file exists, and 0 - if there are none|1|
*doGetSize=Counts the volume of the entire contents of a folder|1|
onOK=The event occurs if the operation is successful|2|
Source=Name of the folder or file on which the operation is performed|4|2
Dest=New folder or file name for Rename operation|4|2

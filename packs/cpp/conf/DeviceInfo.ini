[About]
Version=1.20
Author=nesco

[Type]
Class=Element
Info=Device information
Tab=System

[Property]
@ShowHidden=Allow showing hidden devices|14|1|True,False
NotEmptyInfo=Return only non-empty device parameters|14|0|True,False
onBreakEnable=True - after doStop the onBreak event is called, but onEndEnum is not called|14|1|True,False

[Methods]
doEnumDevice=Starts enumerating devices in the system|1|
doDeviceInfo=Retrieves device information by index from the stream or the DeviceIdx field. ARG(DeviceIdx)|1|
*doStop=Stops searching devices|1|
*doDeviceOnOff=Turns the device on/off. ARG(DeviceIdx, State)|1|
onEnumDevice=The event occurs every time a new device is found in the system. ARG(ParentID, ID, IconIdx, Name, DeviceIdx, ClassGUID, ConfigFlags)|2|
onEndEnum=The event occurs every time the search of all devices in the system is completed. ARG(NULL)|2|
onDeviceInfo=The event occurs every time after receiving information about a device by its number. ARG(ParameterName, Info)|2|
onDevChange=The event occurs every time the list of devices is changed|2|
*onBreak=The event occurs when onBreakEnable=True after the onEnumDevice event, if the doStop method was called. ARG(NULL)|2|
*onDeviceOnOff=The event occurs every time after the device is turned on/off and outputs the state of the device to the stream (-1 - it is impossible to change the state of the device, 1 - the device is on, 2 - the device is off). ARG(State)|2|
CountClasses=Contains the number of device classes found|3|1
CountDevices=Contains the number of devices found|3|1
IconArray=Icon array|3|13
*DeviceIdx=Device index for information|4|1
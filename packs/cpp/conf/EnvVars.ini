[Methods]
doExpand=Expands environment variables in String ARG(String)|1|
*doEnum=Lists available environment variables|1|
*doGet=Gets the value of the environment variable named Name ARG(Name)|1|
*doSet=Sets the Name environment variable to a new Value (current process only) ARG(Name, Value)|1|
*doDelete=Removes the Name environment variable (current process only) ARG(Name)|1|
onExpand=The event occurs whenever the environment variables in a string are expanded, outputting the resulting string to the ARG(String) stream|2|
*onEnum=The event occurs every time the next environment variable is received, outputting its name and value to the ARG(EnvVarString) stream|2|
*onEndEnum=The event occurs after the enumeration of all environment variables is completed|2|
*onGet=The event occurs whenever the value of an environment variable is retrieved by the doGet method, outputting the resulting value to the ARG(Value) stream.|2|
*Result=Contains the result of the current operation|3|
*String=String to convert|4|
*Name=Environment variable name|4|
*Value=Environment variable value for doSet method|4|
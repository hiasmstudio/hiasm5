[Type]
Class=Element
Info=Looping through all elements of an array

[Property]
Type=The direction of searching elements. Inc - from first to last, Dec - from last to first|4|0|Inc,Dec
onBreakEnable=True - after doStop the onBreak event is called, but onEndEnum is not called|14|1|True,False

[Methods]
doEnum=Starts iterating over array elements|1|
doStop=Stops iterating over elements|1|
onItem=Outputs the next array element to the stream|2|
onEndEnum=The event occurs after the completion of enumerating the array elements, and is required if onBreakEnable=False|2|
*onBreak=The event occurs when onBreakEnable=True after the onItem event, if the doStop method was called at the same time|2|
Array=An array whose elements need to be iterated|4|13
Item=Contains the current array element after the onItem event is called|3|
Index=Contains the index of the current array element after the onItem event is called|3|1
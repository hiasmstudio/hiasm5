[Type]
Class=Element
Info=DDE server
Tab=System

[Property]
@ServiceName=DDE service name. Usually matches the program name|2|
+@TopicList=List of topics that this DDE server supports. If the list is empty, then no restrictions are imposed.|5|

[Methods]
doStart=Starts the DDE server|1|0
doStop=Stops the DDE server|1|0
doReturnItem=Returns the required element to the client. This is typically the processing endpoint of onGetItem ARG(ReturnItem)|1|2
doSendChanges=Notifies clients that element values have changed ARG(ChangedItem, ChangedTopic)|1|0
*doSetError=Reports an error executing a DDE command during onExecute processing|1|0
onGetItem=Occurs when a client attempts to request a DDE element. Sets the name of the required topic and element at the points TopicName, ItemName and outputs the name of the element to the stream. The element's value must be returned by calling doReturnItem ARG(ItemName)|2|2
onPutItem=Occurs when a client attempts to transfer a DDE element. Sets the name of the required topic and element at the points TopicName, ItemName and outputs the value of the element ARG(ItemValue) to the stream|2|2
*onConnect=Occurs when trying to connect to a client. Outputs the name of the required topic into the stream. If TopicList is empty and the given topic is not supported by the server, it should raise doSetError ARG(TopicName)|2|2
*onExecute=Occurs when a client requests the execution of a DDE command. Sets the value of the required topic at the TopicName point and issues the DDE command ARG(Command) to the stream|2|2
TopicName=Topic name in the last DDE request|3|2
TopicIndex=Topic index in the last DDE request. The index is determined by the TopicList|3|1
ItemName=Element name in the last DDE request|3|2
ChangedItem=The name of the changed element, used in doSendChanges. An empty line means a change in all elements|4|2
ChangedTopic=The name of the changed topic, used in doSendChanges. An empty line means a change in all topics|4|2
ReturnItem=The value of the element returned to the client|4|2
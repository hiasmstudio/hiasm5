[Type]
Class=Element
Info=Combines two regions
Tab=Windows
Icon=Mode

[Property]
@Mode=Mode for combining two regions into one: AND - intersection, OR - union, XOR - union, excluding any intersecting sections, DIFF - those parts of Region1 that are not parts of Region2 are combined, COPY - A copy of Region1 is created (Region2 is not used)|4|1|AND,OR,XOR,DIFF,COPY

[Methods]
doCombine=Combines two regions into one (with Mode = COPY makes a copy of Region1, Region2 is not used)|1|0
*doClear=Removes the region result of the combination (zeroes the Result)|1|0
onCombine=The event occurs whenever regions are combined and outputs the result to the ARG(Region) stream|2|0
Result=Contains the result of the combination|3|1
ResultIndex=Contains the index of the combination result (0 - error, 1 - empty region, 2 - simple (rectangular) region, 3 - complex (multiple rectangle) region)|3|1
Region1=Specifies the first region to combine|4|1
Region2=Defines a second region to combine|4|1

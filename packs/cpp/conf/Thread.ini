[Type]
Class=Element
Info=Running a parallel thread

[Property]
@Delay=Delay between iterations in milliseconds|1|1000
FastStop=Stop the thread immediately after the first iteration|14|1|True,False
BusyEvent=Reaction to calling the doStart method when a thread is already running|4|0|Ignore,Restart

[Methods]
doStart=Starts a thread for execution|1|
doStop=Stops a thread and waits for it to complete|1|
*doStopFlag=Sets the thread termination flag (immediately returns control to the program)|1|
onExec=The event occurs only when the thread is running with a delay between iterations equal to Delay (see Additional Help)|2|
onSyncExec=Same as the onExec event, only synchronized with the main thread (see Additional Help)|2|
Busy=Contains 1 if the thread is running, 0 otherwise|3|1
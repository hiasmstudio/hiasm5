[About]
Version=1.10
Author=Dilma

[Type]
Class=Element
Info=Stack organization

[Property]
+Default=Stores data by default|3|
IgnorEmpty=Ignore an attempt to take a value from an empty stack when True, and output default data to the stream when False|14|0|True,False

[Methods]
doPush=Saves the current value of the component and equals it to the data from the stream|1|
doPop=Pops a value from the top of the stack and makes it current|1|
*doClear=Clears the stack|1|
onPush=The event occurs whenever data is stored on the stack|2|
onPop=The event occurs whenever data is popped from the stack|2|
*onEmpty=The event occurs when an attempt is made to get data from an empty stack with IgnorEmpty=True|2|
Value=Contains the current value of the component|3|
*Peek=Gets the value of the top of the stack without popping it|3|
Data=Data to be added to the stack|4|
[Methods]
doDrag=Drag and drop list objects|1|
*doAccept=Enables/disables receiving files by the component|1|
onDropFile=The event occurs as many times as the number of files were dropped on the form and displays the name of the next file in the stream ARG(FileName)|2|2
onEndDrop=The event occurs every time after the end of file enumeration|2|

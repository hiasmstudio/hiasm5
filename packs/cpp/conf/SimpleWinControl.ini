[Methods]
*doSetFocus=Sets focus to an element|1|0
*doSendToBack=Places the element below all other form elements|1|
*doBringToFront=Places an element above all other form elements|1|
*doCenterPos=Centers an element relative to its parent element|1|
*doKeyBack=Changes the Key value of child elements. 0 - interception without return|1|
*onKeyUp=The event occurs whenever a key is released. Returns an integer - the key code ARG(Key)|2|1
*onKeyDown=The event occurs every time a key is pressed. Returns an integer - the key code ARG(Key)|2|1
*onShow=The event occurs whenever an element is shown/hidden on the screen|2|0
*onResize=The event occurs whenever the element's size changes|2|0
*onMouseDown=The event occurs whenever the component area is clicked (before the onClick event) and returns the code of the clicked button ARG(Button) to the stream.|2|1
*onMouseMove=The event occurs whenever the mouse moves over the component and returns the code of the pressed button ARG(Button) to the stream.|2|1
*onMouseUp=The event occurs whenever the mouse button is released and returns the code of the pressed button ARG(Button) to the stream.|2|1
*onMouseWheel=The event occurs every time the mouse wheel scrolls over an element and returns its offset ARG(Shift)|2|1
*onMove=The event occurs whenever an element is moved across the screen|2|0
*onPaint=The event occurs whenever it is necessary to draw an element and issues ARG(HDC) to the drawing Context stream.|2|1
*onDblClick=The event occurs whenever an element is double-clicked|2|0
*onSetFocus=The event occurs whenever focus is set on an element|2|
*onKillFocus=The event occurs whenever the element loses focus|2|
*onMouseEnter=The event occurs whenever the mouse pointer moves in the client area of the element|2|1
*onMouseLeave=The event occurs whenever the mouse pointer leaves the element's client area|2|1

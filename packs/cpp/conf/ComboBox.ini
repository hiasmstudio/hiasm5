[Methods]
doAdd=Adds a string to the list from a stream or str field|1|
doClear=Clears the list|1|
doDelete=Removes a line from the list. The line number is retrieved from the stream (0 is the first line)|1|
doText=Initializes the list with strings in the form: <String1,String2,...>|1|
doLoad=Loads a list of strings from a file|1|
doSave=Saves a list of strings to a file|1|
*doSelect=Selects the row at index from the stream|1|
*doEditText=Sets the text of the component's input area|1|
*doEditTextNoEvents=Sets the text of the component's input area, but does not fire the onChangeText event|1|
*doSelectString=Searches for a string in the list and makes it active|1|
*doAddDir=Adds all files from the specified folder|1|
*doReplace=Replaces the index string from the stream with the string Str|1|
onChange=The event occurs whenever the list of strings changes|2|
onClick=The event occurs every time a list item is selected and outputs data to the stream depending on the DataType property ARG(Text or Index, Value)|2|
*onChangeText=The event occurs whenever the text in the input field changes when ReadOnly=False, outputting this text to the ARG(ChangeText) stream|2|
*onSelect=The event occurs whenever a list item is selected using the doSelect method (see DataType) ARG(Text or Index, Value)|2|
Array=Access any list element by its index (see Array component)|3|13

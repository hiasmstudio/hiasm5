[About]
Version=1.11
Author=DiMA

[Type]
Class=Element
Info=Record audio from a microphone or LineIn on a sound card

[Property]
Filename=Contains the default recording file name|2|default.wav
AutoClose=Automatically stop and close the operation after saving|14|0|True,False
@Bits=Quality, bit (these 3 options are used in accordance with the capabilities of the sound card)|14|1|8,16,24,32
@Stereo=Number of audio channels|14|1|Mono,Stereo
@Speed=Recording frequency, kHz|14|4|1000,2000,4000,6000,8000,11025,12000,16000,22050,24000,32000,44100,48000,96000

[Methods]
doRecord=Triggers the operation and begins recording audio into temporary memory|1|
doSave=Writes the record accumulated up to this point to a file|1|
doClose=Completes the operation and frees all occupied memory for recording|1|
*doPause=Pauses the recording process|1|
*doResume=Continues a stopped process|1|
onError=The event occurs if there is an error starting a write operation with the specified parameters|2|
isOpen=Returns 1 if the process has already been started using the doRecord command and was not closed using doClose, and 0 if the process is not running|3|1
isRun=Returns 1 if the process has already started and the recording itself is in progress (no pause), and 0 if the process is not running or recording is in pause mode|3|1
Filename=Specifies the file name for recording|4|2
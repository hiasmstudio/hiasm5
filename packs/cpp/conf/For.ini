[About]
Version=1.0
Author=Dilma

[Type]
Class=Element
Info=Loop with a given number of iterations

[Property]
Start=Sets the initial value of the default loop counter|1|0
End=Sets the default value, upon crossing which the loop exits|1|0
@Step=Sets the amount of counter increment after each iteration|1|1
IncludeEnd=False - loop with range [Start,End], i.e. right border is not included, True - loop with range [Start,End]|14|0|True,False
InData=True - take data from the stream, False - overlap data from the stream with empty data|14|1|True,False
onBreakEnable=True - after doStop the onBreak event is called, but onStop is not called|14|1|True,False

[Methods]
doFor=Starts a loop with a counter|1|
doStop=Premature stop of the cycle|1|
onEvent=The event occurs every time the loop iterates|2|
onStop=The event occurs at the end of the loop, and is required if onBreakEnable=False|2|
*onBreak=The event occurs when onBreakEnable=True, after the onEvent event, if the doStop method was called|2|
Position=Stores the current counter value|3|1
Start=Defines the initial value of the counter|4|1
End=Defines the value that, when crossed, exits the loop.|4|1
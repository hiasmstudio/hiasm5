[Type]
Class=Element
Info=Window enumeration

[Property]
VisibleOnly=True - list only visible windows, False - list all windows|4|0|True,False

[Methods]
doEnum=Begins the procedure of listing (searching) windows|1|
doFind=Searches for one window by given title|1|
doStop=Stops window searching|1|
*doEnumChildWindows=Begins a procedure listing child windows by ID from the stream or ParentHandle field ARG(ParentHandle)|1|
onFindWindow=The event occurs every time a new Windows window is found and outputs the title of this window ARG(Caption) to the stream.|2|2
onEndEnum=The event occurs whenever the search is completed|2|
*onEnumChildWindows=The event occurs every time a new child window is found ARG(ClassName, Handle, Caption)|2|2
Caption=The searched window title for the doFind method|4|2
*ParentHandle=Parent window ID (for the doEnumChildWindows method)|4|1
Handle=Contains the ID of the found window|3|1
*ClassName=Contains the name of the class to which the window belongs|3|2
*GetActiveWindow=Contains the ID of the active Windows window|3|1
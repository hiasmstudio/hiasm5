*WordAtPosStartY=Contains the starting address of the word located under WordPosition along Y|3|1
*PositionX=Caret position from start of line (X)|3|1
*PositionY=Caret position by line number (Y)|3|1
*SelBeginX=Upper value of allocation address in X|3|1
*SelBeginY=Upper allocation address value in Y|3|1
*SelEndX=Low value of allocation address in X|3|1
*SelEndY=Low value of allocation address in Y|3|1
*SelFromX=Selection start address by X|3|1
*SelFromY=Y coordinate where the selection starts|3|1
*SearchResX=Contains the search result - the word address by X after doFind|3|1
*SearchResY=Contains the search result - the word address in Y after doFind|3|1
*PositionMouseX=Stores the X coordinate of the mouse in cursor coordinates after OnMouseXXXX events|3|1
*PositionMouseY=Stores the Y coordinate of the mouse in cursor coordinates after OnMouseXXXX events|3|1

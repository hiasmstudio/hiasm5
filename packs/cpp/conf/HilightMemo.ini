##HilightOption=Backlight Options
@HilightStrings=List of words that need to be highlighted. Input format - Word=Color(=U=B=C=S: Font style, where the sequence and presence of certain characters is not critical), where the backlight colors can be set either by digital values ​​or designated by aliases (Black, Maroon, Green, Olive, Navy, Purple, Teal, Gray, Silver, Red, Lime, Yellow, Blue, Fuchsia, Aqua, White). Symbols: "U" for link, "B" for bold, "C" for italic, and "S" for strikethrough|5|http://=Blue=U
@Hilight=True - enable syntax highlighting, False - disable it|14|0|True,False
@HilightFont=Default font for highlighted words (only Style and Color are used)|15| Courier New,8,0,0,1
@HilightCaseSens=Enable case sensitivity|14|1|True,False
##
##AutoCompleteOption=AutoComplete List Options
@WidthACF=Autocomplete form width|1|200
@HeightACF=Autocomplete form height|1|200
@AutoCompStrings=List of words that are pre-added to the auto-completion dictionary|5|
@AutoComplete=True - enable word completion, False - disable|14|0|True,False
@MinWordLen=Minimum word length after which auto-completion is triggered|1|2
@AllowDelim=Allow the right side of the auto-completion word to be cut off after splitting by the delimiter - the '~' character|14|1|True,False
@AutoSubSpace=Allow replacing the '_' character with a space in the auto-completion list|14|1|True,False
##
##SearchOptions=Find and Replace Options
@FindReplace=True - enable search and replace, False - enable search only|14|1|True,False
@FindBack=False - the search goes from the specified point to the end of the file, True - to the beginning|14|1|True,False
@FindCase=True - search is case sensitive, False - not sensitive|14|1|True,False
@FindSpaces=True - treat tabs (or multiple spaces) as matches when searching; False - ignore them|14|1|True,False
@ReplaceAll=True - find and replace everything, False - find and replace only the first|14|1|True,False
@SelectFound=True - highlight found, False - do not highlight|14|0|True,False
SearchStr=The default string to find|2|
ReplaceStr=The default string to replace the found one with|2|
##
##FileOption=File options
FileName=Defines the default file name for loading/saving the list|2|
FileNameHiLight=Defines the default file name for loading/saving the list of highlighted words|2|
FileNameComplete=Defines the default file name for loading/saving the auto-completion list|2|
##
@AddType=Last - add a new line to the end of the list, First - to the beginning|4|0|Last,First
@ReadOnly=True - text is read-only, False - text is editable|14|1|True,False
@Overwrite=True - by default, enable text overwriting, False - normal text input with a shift (to overwrite, press - Ins)|14|1|True,False
@SmartTabs=True - enable auto-tab when the caret moves, False - do not enable|14|0|True,False
@Indent=Indentation from the beginning of the line when entering text|1|0
@RightMargin=True - show the limit line, False - do not show|14|0|True,False
@WidthRightMargin=Width to limit line in characters|1|80
@ColorRightMargin=Right limit line color|8|clBlue
@ColorUnderLine=Highlight color for underlined words when hovering over them|8|clRed
@AutoFocus=True - enable autofocus capture, False - disable it|14|0|True,False

[Methods]
doAdd=Adds a string to the list from a stream or str field|1|
doClear=Clears the list|1|
doDelete=Removes a line from a list by number from a stream|1|
doText=Initializes the list with strings in the form: <String1,String2,...>|1|
doLoad=Loads a list of strings from a file|1|
doSave=Saves a list of strings to a file|1|
*doInsert=Inserts a row into a list|1|
*doFind=Find or replace text|1|
*doGetBookMIdx=Gets the caret position from the list of marks by mark index (0..9) from the stream in the format Y*65536 + X|1|
*doSetBookMIdx=Stores the position of the caret in the list of marks at the mark index (0..9) from the stream|1|
*doSetCaret=Sets the caret position in the format Y*65536 + X|1|
*doViewToCaret=Scrolls the visible area to the caret|1|
*doTopLine=Scrolls the visible area so that the top line is the value of their stream|1|
*doLeftCol=Scrolls the visible area so that the left column is the value of their stream|1|
*doReplaceSelect=Replaces the selected text with text from the stream|1|
*doDeleteSelect=Removes selected text|1|
*doSetSelBegin=Sets the start of the selection in the format Y*65536 + X|1|
*doSetSelEnd=Sets the end of the selection in the format Y*65536 + X|1|
*doSetSelFrom=Sets the position from which the selection begins in the format Y*65536 + X|1|
*doSelectWordUnderCursor=Highlights the word under the caret|1|
*doIndentSelect=Steps selected rows by value from stream|1|
*doEnsureVisible=Makes the row with the index visible from the stream. When -1 makes the last line visible|1|
*doCut=Cuts selected text to the clipboard|1|
*doCopy=Copies the selected text to the clipboard|1|
*doPaste=Pastes text from the clipboard|1|
*doUndo=Undoes the last change|1|
*doRedo=Returns the last cancellation|1|
*doShowAutoComp=Shows the auto-completion list for the word that has a caret, if any.|1|
*doHideAutoComp=Hides the auto-complete list|1|
*doClearAutoComp=Clears the auto-complete list|1|
*doAddHilightStrings=Adds a list of words that need to be highlighted|1|
*doLoadHiLight=Loads a list of strings of highlighted words from a file|1|
*doSaveHiLight=Saves a list of strings of highlighted words to a file|1|
*doLoadAutoCompl=Loads an auto-completion list from a file|1|
*doSaveAutoCompl=Saves the auto-completion list to a file|1|
onChange=The event occurs whenever the list of strings changes, outputting the text ARG(Text) to the stream.|2|
*onBookMIdx=The event occurs each time a caret position is written to the label list and outputs the label index (0..9) ARG(MIdx) to the stream|2|
*onGetBookMIdx=Outputs the caret position from the list of marks to the stream in the format Y*65536 + X ARG(Position)|2|
*onClickUnderLineStr=The event occurs every time you click on an underlined word, outputting it to the ARG(Word) stream|2|
*onAutoComp=The event occurs whenever an autocorrect word is selected, outputting it to the ARG(AutoCompWord) stream|2|
*onAddAutoComp=The event occurs every time an autocorrect word is added to the autocorrect list, emitting it to the ARG(AddAutoCompWord) stream|2|
*onHScroll=The event occurs every time after horizontal scrolling|2|
*onVScroll=The event occurs every time after vertical scrolling|2|
Text=Stores a list of strings separated by characters 10 and 13|3|2
Count=Stores the number of rows in the list|3|1
Array=Access any list element by its index (see Array component)|3|13
*EndIdx=Contains the index of the last row in the list|3|1
*SelText=Stores the selected text|3|2
*TopLine=Contains the number of the current top line|3|1
*LeftCol=Contains the number of the current left column|3|1
*LinesPerPage=Contains the number of complete visible lines in the page|3|1
*LinesVisiblePartial=Contains the total number of visible rows in the page|3|1
*ColumnsVisiblePartial=Contains the number of visible columns on the page|3|1
*MaxLineWidthOnPage=Contains the length, in characters, of the widest visible line on the page|3|1
*MaxLineWidthInText=Contains the length of the widest line of text in characters|3|1
*LineHeight=Contains the line height in pixels|3|1
*CharWidth=Contains the width of the character in pixels|3|1
*SelText=Stores the selected text|3|2
*SelAvailable=If there is a selection, contains 1, otherwise 0|3|1
*CanUndo=If it is possible to undo the last change contains 1, otherwise 0|3|1
*CanRedo=If it is possible to return, the last cancellation contains 1, otherwise 0|3|1
*WordAtPos=Contains the word under WordPosition|3|2
*WordAtPosMouse=Contains the word under the mouse pointer|3|2

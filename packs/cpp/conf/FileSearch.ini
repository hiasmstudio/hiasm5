[About]
Version=1.22
Author=Dilma, nesco & Galkov

[Type]
Class=Element
Info=Searching for files on disk

[Property]
Ext=Default extension of searched files (the mask is similar to the mask of the StrMask element)|2|*
Dir=Search directory|2|
SubDir=Instructs the component to check all subdirectories located in the current directory|4|0|True,False
FullName=True - show the full path to the file, including its name, False - show only the name|14|0|True,False
FullOtherName=True - output the full path to the file to the onOtherFiles output, including its name, False - output only the name|14|0|True,False
Include=Files - output only file names into the stream, Dirs - only folders, All - output both files and folders|4|0|Files,Dirs,All
TimeType=Defines a time reference|4|0|Global,Local
Format=Defines the format of the FormatTime field string: D - day of the month, W - day of the week, M - month, Y - year, h - hours, m - minutes, s - seconds|2|D.M.Y h:m

[Methods]
doSearch=Searches for files|1|
doStop=Forced stop of file search|1|
onSearch=The event occurs every time a new file is found on the disk and outputs the name of this file to the stream|2|
onEndSearch=The event occurs whenever the search is completed|2|
*onOtherFiles=The event occurs every time the next file is found and its name does not match the mask and outputs it to the stream|2|
Count=Stores the number of files found|3|1
Ext=Extension of searched files or * for all types|4|2
Dir=Folder to search for files (for example, C:\ or C:\Windows\)|4|2
Size=Contains the size of the found file in bytes|3|1
*Attr=Contains file attributes|3|1
*DateCreate=File creation date|3|2
*DateAccess=Last access date of the file|3|2
*DateModify=File last modified date|3|2
*DateCreateReal=File creation date (Real type)|3|7
*DateAccessReal=Last access date of the file (Real type)|3|7
*DateModifyReal=File last modified date (Real type)|3|7
*ShortName=Contains an alternative (short) file name|3|2
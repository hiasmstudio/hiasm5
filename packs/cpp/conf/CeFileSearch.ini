[Type]
Class=Element
Info=Search files

[Property]
Ext=Default extension of the searched files (the mask is similar to the mask of the StrMask element)|2|*
Dir=Search directory|2|\
SubDir=Instructs the component to check all subdirectories located in the current directory (doSearch method only)|4|0|True,False
FullName=True - show the full path to the file, including its name, False - show only the name|14|0|True,False
Include=Files - output only file names into the stream, Dirs - only folders, All - output both files and folders (only for the doSearch method)|4|0|Files,Dirs,All

[Methods]
doSearch=Searches for files|1|
doStop=Forced stop of file search|1|
*doFastSearch=Searches for files, filling the NamesArray and SizesArray arrays with the results|1|
onSearch=The event occurs every time a new file is found on the disk and outputs the name of this file to the stream|2|
onEndSearch=The event occurs whenever the search is completed, outputting the number of files found to the stream.|2|
*onOtherFiles=The event occurs every time the next file is found and its name does not match the mask, issuing it to the stream|2|
Count=Stores the number of files found|3|1
Ext=Extension of searched files or * for all types|4|2
Dir=Folder to search for files (for example, \ or \Windows\)|4|2
Size=Contains the size of the found file in bytes|3|1
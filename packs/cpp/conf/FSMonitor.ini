Info=Monitoring the file system and disabling portable USB drives.

[Property]
+Drive=Drive letter|2|

[Methods]
doDeviceRemove=Ejects portable drives or opens the CDROM tray|1|
onDeviceArrival=The event occurs every time a USB device or CDROM is inserted and outputs its letter to the stream|2|
onDeviceRemoveComplete=The event occurs whenever a USB device or CDROM is removed and outputs its letter to the stream|2|
*onError=The event occurs when a disk disconnection error occurs. Errors: 1-Invalid syntax, 2-No disk in system, 3-Disk busy, 4-Unmount, 5-Disable volume, 6-Open, 7-Complete operation|2|

[Methods]
doConnect=Connects to the server|1|
doRead=Downloads a letter from the server (determined by the index from the stream from 1 to Count)|1|
doDelete=Deletes a letter from the server (determined by the index from the stream from 1 to Count)|1|
*doTop=Reads only the header and the first N lines (determined by the index from the stream from 1 to Count)|1|
doClose=Closes the connection to the server|1|
onConnect=The event occurs every time after a successful connection to the server and displays the number of letters in the mailbox|2|
onRead=The event occurs after a letter is downloaded and outputs its contents to the stream.|2|
*onError=The event occurs after an error occurs in the operation of the component and outputs its code to the stream|2|
Count=Contains the number of letters in the mailbox|3|1
Server=Defines the name of the POP3 mail receiving server|4|2

[Type]
Class=Element
Info=Data compression/recovery using the LZH algorithm
Tab=Files

[Property]
FileName=Name of the file on which the operation is performed|2|
NewFileName=The name of the file resulting from the operation|2|
ProgressInterval=Interval for generating an event informing about the status of encoding progress|1|50

[Methods]
doCompress=Compresses data ARG(Stream, ProgressInterval)|1|0
doDeCompress=Recovers data ARG(Stream, ProgressInterval)|1|0
*doPackFile=Packs the file FileName and saves it to NewFileName ARG(FileName, NewFileName, ProgressInterval)|1|0
*doUnpackFile=Unpacks file FileName and saves it to NewFileName ARG(FileName, NewFileName, ProgressInterval)|1|0
onStream=The event occurs every time after data is compressed/restored and returns it to the ARG(Stream) stream|2|0
*onPackUnpackFile=The event occurs every time a file is packed/unpacked and, if successful, returns the size of the created file ARG(Size)|2|0
*onPackUnpackError=The event occurs when it is impossible to create the file ARG(NULL)|2|0
*onProgress=The event occurs every time after part of the operation is completed, outputting the current progress value ARG(Progress) to the stream.|2|0
*onProgressMax=The event occurs every time before the start of an operation, outputting the maximum progress value ARG(ProgressMax) to the stream.|2|0
Stream=Defines the data area identifier|4|10
*FileName=Name of the source file on which the operation is performed|4|2
*NewFileName=File name to save the result of the packing/unpacking operation|4|2
*ProgressInterval=Interval for generating an event informing about the status of encoding progress|4|1
*DestSize=Contains the size of the data after the operation|3|1
*Position=Contains the current progress position while performing compression/recovery operations|3|1
*OriginalSize=Contains the size of the original data, updated immediately after encoding starts|3|1
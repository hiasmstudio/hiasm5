*doRename=Renames the selected node|1|
*doSelect=Selects the node whose index is specified in the stream|1|
*doSort=Sorts the entire tree|1|
*doLoadFromText=Loads a list of nodes from text in a stream|1|
*doAddIcon=Adds an icon from the stream to the main list of icons|1|
*doAddStIcon=Adds an icon from the stream to the list of status icons|1|
*doAddChild=Adds a node named from the stream or str field as a child of the Parent node|1|
*doItemBold=Enables/disables displaying the node with the index from the stream in bold font|1|
*doItemHasChild=Forces the node with the index from the stream to be its parent|1|
*doItemPath=Gets the Delimiter-delimited "path" from the root node to the specified node at index from the stream|1|
*doExpand=Opens the knot. The node number is extracted from the stream|1|
*doCollapse=Slams the knot. The node number is extracted from the stream|1|
*doExpandToggle=If the knot is open, it closes it, and if it is open, it slams it. The node number is extracted from the stream|1|

[Type]
Class=Element
Info=Mouse Action Emulator

[Property]
Button=Default mouse button|1|1
WheelDelta=Number of scroll units|1|120

[Methods]
doClick=Presses a Button|1|
doMove=Moves the mouse X pixels horizontally and Y pixels vertically|1|
*doPosition=Sets the mouse to X and Y coordinates|1|
*doWheel=Scrolls the mouse wheel (Win 2K only)|1|
*doVisible=Hides/shows the mouse cursor in the application|1|
*doMouseDown=Emulates a mouse button press|1|
*doMouseUp=Emulates releasing a mouse button|1|
*onVisible=The event occurs every time after doVisible, outputting the mouse display number to the stream (at -1 the mouse is disabled)|2|
MouseX=Contains the X coordinate of the mouse relative to the screen|3|1
MouseY=Contains the Y coordinate of the mouse relative to the screen|3|1
*Handle=Contains the ID of the window under the mouse cursor|3|1
Button=Mouse button|4|1
X=X coordinate|4|1
Y=Y coordinate|4|1
*WheelDelta=Number of scroll units|4|1
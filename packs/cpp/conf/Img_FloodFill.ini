[Type]
Class=Element
Inherit=ImgDrawXY
Info=Fills an area at a specified point
Tab=Graphics

[Property]
Color=Defines the color of the dots (pixels)|8|clWhite
ColorBorder=Defines the color of the points (pixels) of the fill border with the FillType=Border property|8|0
@PatternStyle=Filling an area with a template image. True - fill the figure with the template image; if there is no template, the figure is not filled, False - fill the figure with the Style fill style|14|1|True,False
@Style=Area fill style: bsClear - no fill, bsSolid - BgColor, bsHorizontal - horizontal lines, bsVertical - vertical lines, bsFDiagonal - descending stroke from left to right, bsBDiagonal - ascending stroke from left to right, bsCross - grid, bsDiagCros - diagonal grid|14|1|bsClear,bsSolid,bsHorizontal,bsVertical,bsFDiagonal,bsBDiagonal,bsCross,bsDiagCross
@FillType=Area filling method: Surface - the area to be painted is all points (pixels) with color at point X, Y, Border - the area to be painted will be limited by the ColorBorder color|4|1|Surface,Border

[Methods]
Color=Dot color|4|1
*ColorBorder=Color of points (pixels) of the fill border with the FillType=Border property|4|1
*Pattern=Image of the pattern for filling the shape with PatternStyle=True|4|11
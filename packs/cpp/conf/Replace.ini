[Type]
Class=Element
Info=Replacing text in a string

[Property]
SubStr=Default string to replace|2|
DestStr=Default string to replace with |2|

[Methods]
doReplace=Replaces the substring sub_str in the string str with the string dest (all found substrings are replaced)|1|
onReplace=The event occurs whenever a row replacement is completed|2|
*CurentStr=The line in which the replacement occurs, before the next replacement is carried out|3|2
*CurentPos=Position of the Sub_str fragment in the CurrentStr string, before replacement with Dest|3|1
Str=The line where the replacement occurs|4|2
Sub_str=Substring to be replaced|4|2
Dest=Substring to replace with|4|2
*Skip=When replacing, this field is checked for 0, and if it is 0, then the Sub_str fragment is replaced with the Dest string, otherwise - skip|4|1
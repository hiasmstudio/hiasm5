[Type]
Class=Element
Info=Program Execution Delay

[Property]
Delay=Number of CPU ticks (for doSleep) or microseconds (for doSleepMks) to wait|1|0

[Methods]
doSleepMks=Delays an event for the specified time|1|
doSleep=Delays an event by the specified number of ticks|1|
onSleep=Event occurs after the delay ends|2|

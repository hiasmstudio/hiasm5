[Type]
Class=Element
Info=TCP server

[Property]
Port=Server port|1|0
DataType=Data type for transmission and reception|4|1|dtInteger,dtString,dtReal,dtStream

[Methods]
doOpen=Starts the server|1|
doClose=Disconnects connections with all clients and stops the server|1|
doSend=Sends data to a port|1|
*doCloseAll=Breaks connections with all clients, but does not stop the server|1|
*doCloseByIP=Closes the connection with all clients having the specified IP ARG(IP)|1|
*doSendByIp=Sends data to the port on the specified IP ARG(Data, IP)|1|
onRead=Receiving data from port ARG(Data, IP)|2|
onConnect=The event occurs when a new client connects to the server and outputs its IP to the stream|2|
onDisconnect=The event occurs when the client disconnects from the server and outputs its IP to the stream|2|
*onServerConnect=Event occurs when server creation is successful|2|
*onServerDisconnect=Event occurs when the server is successfully closed|2|
*onProgress=The event occurs whenever a data array is sent (DataType = dtStream)|2|
*onError=The event occurs when there is an error working with a socket|2|
Count=Contains the number of active connections (clients)|3|1
IP=Contains an array of IP addresses of all clients connected to the server|3|13
Data=Data to send to clients|4|
Port=Defines the server port|4|1
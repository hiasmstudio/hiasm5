[Type]
Class=Element
Info=Zip archiver

[Property]
FileMask=Multiple file search mask, for example: *.TXT (only for packaging using multiple search mask)|2|
ZipFileName=Specifies the name of the archive file|2|
BasePath=Path for unpacking or multiple packing|2|
@Password=If a password is specified, the files in the archive will be encrypted when packaged or decrypted when unpacked|2|
##ZIP=Packaging options
Method="NoCompression" - save in an archive without packaging. "Fast" - fast packaging with a low compression ratio. "Normal" - optimal speed/compression ratio. "Max" - maximum compression ratio at low packaging speed|4|0|NoCompression,Fast,Normal,Max
UpdateMode="Add&Replace" - if the file is not in the archive, it will be added, otherwise it will be replaced. "Freshen" - the file will be added if it is already in the archive and the added file is newer than the archived one. "Update" - the file will be added to the archive even if it is not there, if it is there, then only if it is newer than the archived one|4|0|Add&Replace,Freshen,Update
IncludeSubfolders=If True, files will also be searched in subdirectories (only for packaging using a multiple search mask)|4|0|True,False
ResetAttr=If True, then the "Archive" attribute of the packed file will be reset after being archived|4|0|True,False
CheckAttr=If True, only files with the "Archive" attribute set will be packed (only for packing using a multiple search mask)|4|0|True,False
SpanSize=-1 - without breaking into parts. 0 - automatic breakdown by filling (only for removable media). N - split into parts of N bytes in size (not for removable media only)|1|-1
Comment=Comment - if specified, it will be added to the archive|2|
##
##UNZIP=Unpacking options
TestOnly=If True, archive testing mode without unpacking|4|1|True,False
OverwriteExisting=If True, any existing files will be overwritten when unpacking, otherwise they will be skipped|4|0|True,False
SkipOlder=If True, newer files will not be overwritten when unpacking|4|0|True,False
UseFolders=If True, when unpacking, files will be placed according to the stored information about subdirectories|4|0|True,False
##
Progress=On the onProgress event, it outputs to the stream: Files - the current number of processed files; Bytes - current number of bytes processed|4|0|Files,Bytes

[Methods]
doCreate=Creates a new archive|1|
*doOpen=Opens an existing archive|1|
*doList=Gets a list of files in the archive|1|
doOrder=Adds a file to the list for packaging in the archive|1|
*doOrderMulti=Adds a file to the list for packing into an archive using a multiple selection mask|1|
doCompress=Packs list files into an archive|1|
*doExtractOne=Extracts a file from an archive with the index obtained from the top point|1|
*doExtractAll=Unpacks the entire contents of the archive|1|
*doDelete=Deletes a file from the archive with the index obtained from the stream|1|
*doCancel=Interrupts the archive packing or unpacking operation|1|
doClose=Closes the archive|1|
onProgress=Every second event to display the progress of the work process|2|
onError=Occurs after the execution of any element method and returns the operation completion code; if not equal to 0, an error occurred (for error codes, see help)|2|

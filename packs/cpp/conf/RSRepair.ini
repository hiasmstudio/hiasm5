[Type]
Class=Element
Info=Data recovery using RS codes (255,223,16)
Tab=Tools

[Property]
@LengthDataBlock=Data block size (1..223)|1|223
@ValueSymbolFill=Placeholder character value (0..255)|1|0

[Methods]
doEncode=Gets the checksum block ARG(DataEncode)|1|0
doDecode=Recovers data ARG(DataDecode, ChkSumDecode)|1|0
onEncode=The event occurs every time after receiving a block of checksums and outputs the result to the ARG(ChkSumBlock, DataBlock, Remaind) stream|2|0
onDecode=The event occurs every time after a data block has been restored and outputs the result to the ARG(RepairDataBlock) stream|2|0
onInfo=The event occurs every time after the completion of any operation and issues a completion code to the ARG(Info, CountErrors) stream|2|0
*DataBlock=Contains the current data block|3|2
*Remaind=Contains the current remaining data for which the checksum block has not been received|3|2
*ChkSumBlock=Contains the current block of checksums|3|2
*RepairDataBlock=Contains the currently restored data block|3|2
*CountErrors=Contains the current number of bugs corrected|3|2
DataEncode=Data for obtaining a block of checksums|4|2
DataDecode=Data to recover|4|2
ChkSumDecode=Checksum block for recovery|4|2
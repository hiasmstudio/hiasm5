[About]
Version=1.10 for b164 and higher for Delphi and FPC
Author=nesco & HiAsm ©

[Type]
Class=Element
Info=Organizing a chain of comparison events with the output of predetermined data to the stream
Tab=Tools

[Property]
+Value=Specifies a comparison constant|3|
@DataOnTrue=Defines data for the True state|3|

[Methods]
doCase=Compares the value from the stream with the constant parameter Value. If these values ​​are equal, the onTrue event is called, otherwise onNextCase with a copy of the input data. onNextCase - usually associated with the next Case cascade|1|
onNextCase=The event occurs whenever the value from the stream is not equal to the value of the Value parameter. Unchanged data from the input is transferred to the stream|2|
onTrue=The event occurs whenever the value from the stream is equal to the value of the Value parameter and outputs data from the DataOnTrue cell to the stream|2|
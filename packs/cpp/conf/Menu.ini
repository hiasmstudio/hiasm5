Info=Main application menu

[Property]
+Menu=Defines menu items (the - sign is used to skip an item)|5|

[Methods]
doInit=Creates a menu|1|
onSelectStr=The event occurs when a menu item is clicked and outputs the line of this item to the stream|2|
*onSelectNum=The event occurs when a menu item is clicked and outputs the ordinal index of this item to the stream (starts at 0)|2|
Handle=Returns the ID of the menu to be manipulated from other elements|3|1
Array=An array of strings whose elements you want to insert into the menu|4|13
[Type]
Class=Element
Info=Key switch control

[Methods]
doNumLock=Switches the mode of the NumLock key|1|
doCapsLock=Toggles CapsLock key mode|1|
doScrollLock=Toggles the ScrollLock key mode|1|
*doReset=Turns off all 3 LED keys|1|
*doOn=Includes all 3 keys with LEDs|1|
*doNumLockOn=Enables NumLock key mode|1|
*doCapsLockOn=Enables CapsLock key mode|1|
*doScrollLockOn=Enables ScrollLock key mode|1|
*doNumLockOff=Turns off NumLock key mode|1|
*doCapsLockOff=Turns off CapsLock key mode|1|
*doScrollLockOff=Turns off ScrollLock key mode|1|
*NumLock=Contains the NumLock value|3|1
*CapsLock=Contains the CapsLock value|3|1
*ScrollLock=Contains the ScrollLock value|3|1
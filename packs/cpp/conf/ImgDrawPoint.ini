[Type]
Class=Element
Info=Drawing figures

[Handlers]
PointXY=Point1,Point2

[Property]
Point1=Default coordinates of the top left corner of the figure|1|0
Point2=Default coordinates for the bottom right corner of a shape|1|0
Point2AsOffset=Count the coordinates of the second point relative to the first (i.e. the second point is the length and height of the figure)|14|1|True,False
@DrawSource=Graphics output object: Bitmap - picture, Handle - window or Windows control, Context - device context|4|0|Bitmap,Handle,Context
@PatternStyle=Filling a shape with a template image. True - fill the figure with the template image; if there is no template, the figure is not filled, False - fill the figure with the Style fill style|14|1|True,False
@Style=Shape fill style: bsClear - no fill, bsSolid - BgColor, bsHorizontal - horizontal lines, bsVertical - vertical lines, bsFDiagonal - descending stroke from left to right, bsBDiagonal - ascending stroke from left to right, bsCross - grid, bsDiagCros - diagonal grid|14|0|bsClear,bsSolid,bsHorizontal,bsVertical,bsFDiagonal,bsBDiagonal,bsCross,bsDiagCross
@LineStyle=Line or frame style (only with Size = 1): psSolid - solid, psDash - dashed, psDot - dotted, psDashDot - dash-dotted, psDashDotDot - alternating dash and two dotted lines|14|0|psSolid,psDash,psDot,psDashDot,psDashDotDot
Size=Line size (thickness) from 1 or more|1|1

[Methods]
doDraw=Draws a shape with the top left corner at Point1 and the bottom right corner at Point2|1|
onDraw=The event occurs every time after the figure is drawn|2|
Bitmap=The graphic output object on which you want to draw the shape|4|11
*Point1=Coordinates of the top left corner of the figure|4|1
*Point2=Coordinates of the lower right corner of the figure|4|1
*Size=Line size|4|1
*Pattern=Image of the pattern for filling the shape with PatternStyle=True|4|11
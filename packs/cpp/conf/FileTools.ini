[Type]
Class=Element
Info=Delete/copy/move/check for file presence on disk

[Property]
DelToRecycle=If this property is True, then the deleted files will be placed in the trash|4|0|True,False
FileName=The name of the file on which the default operation is performed|2|
NewFileName=New default file name for Move and Copy operations|2|

[Methods]
doMove=Moves file FileName to NewFileName|1|
doCopy=Copies file FileName to NewFileName|1|
doDelete=Deletes a file named FileName|1|
doFileExists=Checks the presence of a file named FileName on the disk and outputs the result to the stream: 1 - the file exists, 0 - the file does not exist|1|
onEnd=The event occurs whenever an operation is performed on a file|2|
FileName=Name of the file on which the operation is performed|4|2
NewFileName=New file name for Move and Copy operations|4|2
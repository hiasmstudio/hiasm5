[Methods]
doStart=Starts the service|1|
doStop=Stops the service|1|
doInstall=Installs a service on the system|1|
doUninstall=Removes a service from the system|1|
*doPause=Pauses the service|1|
*doContinue=Resumes the service|1|
*doShutdown=Forced termination of service|1|
*doEnumServices=Lists all services in the system|1|
*doGetStatus=Gets the state of the service|1|
onStatus=Returns 0 if the action completes successfully, and an error number otherwise|2|
onExecService=The event occurs every time after a service file is successfully launched with the /install or /uninstall parameters|2|
onExecError=The event occurs whenever there is an error starting a service file|2|
*onEnumServices=The event occurs after finding the next service ARG(Name, DisplayName, Status)|2|
*onGetStatus=Returns the status of the service: 0 - not in the system, 1 - stopped, 2 - in the process of starting, 3 - in the process of ending, 4 - running, 5 - in the process of starting after a temporary stop, 6 - in the process of a temporary stop, 7 - temporarily stopped ARG(Status)|2|
*StatusService=Contains the received service status: 0 - not in the system, 1 - stopped, 2 - in the process of starting, 3 - in the process of finishing, 4 - running, 5 - in the process of starting after a temporary stop, 6 - in the process of a temporary stop, 7 - temporarily stopped|3|1

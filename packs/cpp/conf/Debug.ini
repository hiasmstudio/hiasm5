[Type]
Class=Debug
Info=Debugging the program
Tab=Helpers

[Property]
EventDelay=The time during which the WEName dot will be highlighted in the debugging window after an event arrives at the doEvent input (if you specify 0, the line will not be highlighted)|1|100
WEName=Work-Event control point name (if a name is not specified, the point will not be displayed)|2|DebugWEPoint
VDName=The name of the Var-Data breakpoint for the returned data (if a name is not specified, the point will not be displayed)|2|DebugVDPoint
UpName=The name of the Var-Data breakpoint for the request data (if a name is not specified, the point will not be displayed)|2|
LogCount=Number of entries in the logs (if 0 the log will be disabled)|1|0
LogFormat=Log entry format: %time - time of arrival of the event and entry into the log, %type - type of data received in the stream, %data - data itself|2|%time Type = %type : %data
Enabled=On/off debug points|14|0|True,False
Synchronize=Enable synchronous debugger mode (delay application operation)|14|1|True,False

[Methods]
doEvent=Debugging an Event Stream|1|0
onEvent=The event occurs immediately after calling the doEvent method and outputs the data received as input to the stream (Data - not used!)|2|0
Var=Contains data from the Data input|3|0
Data=Data flow control|4|0

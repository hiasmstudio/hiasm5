[Type]
Class=Element
Sub=Form
Info=Extended pop-up context menu in XP style
Tab=WinControls
Inherit=XPMenu

[Property]
vtOffset=The vertical offset of the left image in pixels from the top of the menu|1|0
AutoBackClrImg=Automatic assignment of the background color of the left image according to its top gradient|14|0|True,False
@PictureLeft=Picture from the left edge of the menu|11|

[Methods]
*doPopup=Expands the menu at the point whose coordinates are contained in the stream in the format Y*65536 + X|1|0
doPopupHere=Expands the menu at the point where the cursor is located|1|0
doClear=Removes all menu items|1|0
doInit=Initializes the menu list (list of items - in a stream)|1|2
*onEndPopup=The event occurs whenever the dropdown menu is closed, but before the MenuItemIdx and MenuItemName|2|0